<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SPINE" />
  <title>SPINE — 3D Rotary CD Jukebox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background-color: #050507;
      color: #f4f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #chassis-viewport {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050507;
      padding: 0;
      transition: padding 0.3s ease;
    }

    #chassis-viewport.padded-mode {
      background: radial-gradient(circle at center, #14151a 0%, #050507 100%);
      padding: 16px;
    }

    #spine-device {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0a0a0d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #spine-device.preview-10-3 {
      width: min(100%, calc((100dvh - 32px) * (10 / 3)));
      height: auto;
      aspect-ratio: 10 / 3;
      border-radius: 18px;
      border: 10px solid #1b1c22;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    #spine-device.preview-ipad {
      width: min(100%, calc((100dvh - 32px) * (4 / 3)));
      height: auto;
      aspect-ratio: 4 / 3;
      border-radius: 26px;
      border: 14px solid #1b1c22;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    #spine-device.real-scale-127 {
      width: var(--real-w, 309mm) !important;
      height: var(--real-h, 92.7mm) !important;
      max-width: 98vw;
      aspect-ratio: 10 / 3;
      border-radius: 14px;
      border: 8px solid #1b1c22;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(251, 191, 36, 0.35);
    }

    /* 좌측 상단 컴팩트 메뉴 버튼 & 스크롤 다운 드로어 */
    #corner-menu-anchor {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 14px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    #corner-menu-trigger {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(20, 21, 27, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    #corner-menu-trigger:hover {
      background: rgba(32, 34, 42, 0.95);
      border-color: rgba(251, 191, 36, 0.45);
    }

    #back-to-artists-btn {
      pointer-events: auto;
    }

    #corner-dropdown-panel {
      pointer-events: none;
      width: min(310px, 86vw);
      max-height: min(calc(100dvh - 76px), calc(100% - 54px));
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      border-radius: 16px;
      background: rgba(16, 17, 22, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.92);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform-origin: top left;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.96);
      transition: opacity 0.22s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.22s;
    }

    #corner-dropdown-panel.open {
      pointer-events: auto;
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      transition: opacity 0.22s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s;
    }

    /* 3D 로터리 주크박스 & 일렬 SPINE 하이브리드 스테이지 */
    #shelf-stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(251, 191, 36, 0.08) 0%, transparent 58%),
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 65%),
        linear-gradient(180deg, #09090c 0%, #111217 86%, #070709 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      cursor: grab;
      touch-action: pan-y;
    }

    #shelf-stage:active {
      cursor: grabbing;
    }

    /* 초기 상태: 일렬 SPINE 선반 뷰 */
    #spine-shelf-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding-bottom: 14px;
      transition: opacity 0.36s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 20;
      pointer-events: auto;
    }

    #shelf-stage.rotary-mode #spine-shelf-layer {
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      pointer-events: none;
    }

    #shelf-rail {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: linear-gradient(180deg, #2d3039 0%, #1a1c22 55%, #0e0f13 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.85);
      z-index: 15;
      pointer-events: none;
    }

    #shelf-viewport {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: flex-end;
      scrollbar-width: none;
    }

    #shelf-viewport::-webkit-scrollbar {
      display: none;
    }

    #cd-track {
      display: flex;
      align-items: flex-end;
      height: 84%;
      padding: 0 46vw;
      gap: 4px;
    }

    .cd-spine {
      position: relative;
      width: 34px;
      height: 100%;
      border-radius: 4px 4px 1px 1px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        margin 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.2s ease,
        box-shadow 0.25s ease;
      box-shadow:
        inset 1px 0 0 rgba(255, 255, 255, 0.28),
        inset -1px 0 0 rgba(0, 0, 0, 0.55),
        2px 0 8px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .cd-spine:hover {
      transform: translateY(-10px);
      filter: brightness(1.12);
      z-index: 10;
    }

    .cd-spine.selected {
      transform: translateY(-12px);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.8), 0 12px 26px rgba(0, 0, 0, 0.92);
    }

    .jewel-teeth {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.22) 0px,
        rgba(255, 255, 255, 0.22) 2px,
        rgba(0, 0, 0, 0.35) 2px,
        rgba(0, 0, 0, 0.35) 4px
      );
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .acrylic-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.03) 38%,
        transparent 52%,
        rgba(255, 255, 255, 0.08) 100%
      );
      pointer-events: none;
    }

    .spine-top-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.75;
      writing-mode: vertical-rl;
      max-height: 36px;
      overflow: hidden;
      padding-left: 3px;
    }

    .spine-title-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      overflow: hidden;
      padding: 6px 0 6px 3px;
      gap: 6px;
    }

    .spine-artist {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 44%;
    }

    .spine-sep {
      opacity: 0.45;
      font-size: 8px;
    }

    .spine-album {
      font-size: 9px;
      font-weight: 500;
      opacity: 0.88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 48%;
    }

    .spine-bottom-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      opacity: 0.6;
      padding-left: 3px;
    }

    /* 앨범 선택 시 활성화되는 3D 로터리 드럼 레이어 */
    #rotary-drum-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
      transition: opacity 0.38s ease, transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 10;
    }

    #shelf-stage.rotary-mode #rotary-drum-layer {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      z-index: 22;
    }

    /* 하단 원형 턴테이블 링 */
    #rotary-turntable-ring {
      position: absolute;
      bottom: 6%;
      left: 50%;
      width: min(86vw, 860px);
      height: 130px;
      border-radius: 50%;
      border: 1px solid rgba(251, 191, 36, 0.24);
      box-shadow: 0 0 70px rgba(251, 191, 36, 0.09), inset 0 0 40px rgba(251, 191, 36, 0.06);
      background: radial-gradient(ellipse at center, rgba(251, 191, 36, 0.08) 0%, transparent 72%);
      transform: translateX(-50%) rotateX(74deg);
      pointer-events: none;
      z-index: 4;
    }

    #rotary-wheel {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* 원통형 드럼 위에 배치되는 개별 CD 슬롯 */
    .rotary-slot {
      position: absolute;
      height: min(84%, 74vw);
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease, filter 0.28s ease;
      box-shadow:
        0 24px 55px rgba(0, 0, 0, 0.88),
        0 0 0 1px rgba(255, 255, 255, 0.14);
      background: #14151a;
    }

    .rotary-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 슬롯 왼쪽 투명 아크릴 주얼 케이스 스파인 엣지 */
    .slot-jewel-edge {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 18px;
      background: linear-gradient(90deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.05) 38%, rgba(0,0,0,0.72) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 3;
    }

    .slot-jewel-edge span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.72);
      white-space: nowrap;
      max-height: 82%;
      overflow: hidden;
    }

    /* 중앙 앨범 쇼케이스 오버레이 (정사각형 3D 플립 + 우측 CD 부클릿 가사창) */
    #expanded-showcase {
      position: absolute;
      inset: 0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0px;
      pointer-events: none;
      z-index: 45;
      opacity: 0;
      visibility: hidden;
      transform: translateZ(260px) scale(0.95);
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), gap 0.36s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.28s;
    }

    #expanded-showcase.active {
      opacity: 1;
      visibility: visible;
      transform: translateZ(260px) scale(1);
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), gap 0.36s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s;
    }

    #expanded-showcase.has-lyrics {
      gap: 16px;
    }

    #showcase-card {
      pointer-events: auto;
      position: relative;
      height: min(86%, 76vw);
      max-height: calc(100% - 16px);
      aspect-ratio: 1 / 1;
      width: auto;
      flex-shrink: 0;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      border-radius: 16px;
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.94),
        0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    #showcase-card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      overflow: hidden;
    }

    .card-front {
      background: #121316;
      cursor: pointer;
    }

    .card-back {
      background: rgba(13, 14, 18, 0.97);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* 우측 CD 부클릿 가사창 */
    #lyrics-booklet {
      pointer-events: none;
      width: 0;
      height: min(86%, 76vw);
      max-height: calc(100% - 16px);
      opacity: 0;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(16, 17, 22, 0.96);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.94);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    }

    #expanded-showcase.has-lyrics #lyrics-booklet {
      width: min(46vw, 560px);
      opacity: 1;
      pointer-events: auto;
    }

    /* 비주얼라이저 전체화면 모드 (선택된 기기 프레임 #spine-device 영역 내부에 꽉 차도록 맞춤) */
    #lyrics-booklet.visualizer-fullscreen {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 80 !important;
    }

    /* 부클릿 상단 토글 메뉴 드롭다운 */
    #booklet-menu-drawer {
      transform-origin: top right;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-6px) scale(0.96);
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.2s;
    }

    #booklet-menu-drawer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s;
    }

    .lyric-line {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 17px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.42);
      transition: color 0.25s ease, transform 0.25s ease, background 0.25s ease;
      cursor: pointer;
    }

    .lyric-line:hover {
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.05);
    }

    .lyric-line.active {
      color: #fde68a;
      font-weight: 700;
      transform: scale(1.02);
      background: linear-gradient(
        90deg,
        rgba(251, 191, 36, 0.25) calc(var(--line-progress, 0) * 100%),
        rgba(255, 255, 255, 0.06) calc(var(--line-progress, 0) * 100%)
      );
    }

    /* 앨범 커버 하단 플레잉 바 */
    #cover-playing-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(0deg, rgba(6, 6, 9, 0.96) 0%, rgba(10, 10, 14, 0.88) 85%, transparent 100%);
      backdrop-filter: blur(14px);
      padding: 18px 14px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }

    #cover-playing-bar.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* 가사창이 열렸을 때는 앨범 커버 하단 바를 숨겨 아트워크 전체를 온전히 표시 */
    #expanded-showcase.has-lyrics #cover-playing-bar {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* 가사창 하단 전용 플레잉 바 */
    #lyrics-playing-bar {
      display: none;
      flex-shrink: 0;
      background: rgba(10, 11, 15, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
    }

    #lyrics-playing-bar.visible {
      display: block;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="chassis-viewport">
    <div id="spine-device">
      <!-- 좌측 상단 단일 트리거 버튼 + 스크롤 다운 메뉴 패널 -->
      <div id="corner-menu-anchor">
        <div class="flex items-center gap-2">
          <button id="corner-menu-trigger" onclick="toggleCornerMenu()" title="메뉴 열기/닫기">
            <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]"></span>
            <span class="font-mono text-xs font-extrabold tracking-widest text-white">SPINE</span>
            <span id="corner-menu-arrow" class="font-mono text-[10px] text-zinc-400 transition-transform duration-200">▼</span>
          </button>

          <!-- 아티스트 앨범 목록 상태일 때만 바로 눌러 복귀할 수 있는 컴팩트 백 버튼 -->
          <button
            id="back-to-artists-btn"
            onclick="backToArtistRotary()"
            class="hidden px-3 py-1.5 rounded-full bg-amber-400/20 hover:bg-amber-400/30 backdrop-blur-md border border-amber-400/50 text-[11px] font-bold text-amber-300 shadow-lg transition"
          >
            ◀ 아티스트 목록
          </button>
        </div>

        <!-- 스크롤 다운 드롭다운 메뉴 -->
        <div
          id="corner-dropdown-panel"
          class="custom-scroll"
          onclick="event.stopPropagation()"
          onwheel="event.stopPropagation()"
          ontouchstart="event.stopPropagation()"
          ontouchmove="event.stopPropagation()"
        >
          <!-- 1. 서버 연결 상태 & 카운터 -->
          <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-white/10">
            <span id="plex-badge" class="px-2 py-0.5 rounded bg-zinc-800/90 border border-white/10 font-mono text-[10px] text-zinc-400">
              CONNECTING...
            </span>

    function applyRealScaleMode(mode) {
      const vp = document.getElementById('chassis-viewport');
      const dev = document.getElementById('spine-device');
      vp.classList.remove('padded-mode');
      dev.classList.remove('preview-10-3', 'preview-ipad', 'real-scale-127');
      dev.style.removeProperty('--real-w');
      dev.style.removeProperty('--real-h');

      if (mode === 'full') {
        showToast('아이패드 / 전체화면 꽉채움 모드');
      } else if (mode === 'ipad') {
        vp.classList.add('padded-mode');
        dev.classList.add('preview-ipad');
        showToast('iPad 가로(4:3) 프레임 미리보기');
      } else if (mode === 'fit') {
        vp.classList.add('padded-mode');
        dev.classList.add('preview-10-3');
        showToast('10:3 바 디스플레이 비율 모드');
      } else if (mode === 'real') {
        vp.classList.add('padded-mode');
        dev.classList.add('real-scale-127');
        showToast('12.7인치 표준 물리 크기 (가로 30.9cm × 세로 9.27cm)');
      } else {
        vp.classList.add('padded-mode');
        const inch = Number(mode);
        const aspectW = inch === 34 ? 21 : 16;
        const aspectH = 9;
        const diag = Math.hypot(aspectW, aspectH);
        const monitorWidthMm = (inch * 25.4) * (aspectW / diag);
        const screenLogicalWidthPx = window.screen.width || window.innerWidth;
        const pxPerMm = screenLogicalWidthPx / monitorWidthMm;
        const targetW = Math.round(309 * pxPerMm);
        const targetH = Math.round(92.7 * pxPerMm);

        dev.style.setProperty('--real-w', `${targetW}px`);
        dev.style.setProperty('--real-h', `${targetH}px`);
        dev.classList.add('real-scale-127');
        showToast(`${inch}인치 모니터 기준 1:1 실물 크기 (${targetW}×${targetH}px)`);
      }
      renderRotaryDrum();
      setTimeout(resizeVisualizerCanvas, 60);
    }

    async function loadPlexLibrary() {
      const badge = document.getElementById('plex-badge');
      badge.textContent = 'SYNCING PLEX...';
      showToast('Plex 음악 라이브러리를 불러오는 중...');

      try {
        const tokenParam = plexConfig.token ? `&X-Plex-Token=${encodeURIComponent(plexConfig.token)}` : '';
        const endpoint = `${plexConfig.url}/library/sections/${plexConfig.section}/all?type=9${tokenParam}`;
        const res = await fetch(endpoint, {
          headers: { Accept: 'application/json' }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rawList = data?.MediaContainer?.Metadata || [];

        if (!rawList.length) throw new Error('앨범이 비어 있습니다');

        allAlbums = rawList.map((item, idx) => {
          const palette = SPINE_PALETTES[idx % SPINE_PALETTES.length];
          const thumbPath = item.thumb || item.parentThumb || '';
          const encodedThumb = thumbPath ? encodeURIComponent(thumbPath) : '';
          const encodedToken = encodeURIComponent(plexConfig.token);
          const thumbUrl = thumbPath
            ? `${plexConfig.url}/photo/:/transcode?width=320&height=320&minSize=1&upscale=1&url=${encodedThumb}${encodedToken ? `&X-Plex-Token=${encodedToken}` : ''}`
            : '';
          const coverUrl = thumbPath
            ? `${plexConfig.url}/photo/:/transcode?width=800&height=800&minSize=1&upscale=1&url=${encodedThumb}${encodedToken ? `&X-Plex-Token=${encodedToken}` : ''}`
            : '';

          return {
            id: String(item.ratingKey),
            artist: item.parentTitle || 'Unknown Artist',
            title: item.title || 'Untitled Album',
            year: item.year ? String(item.year) : '',
            label: item.studio || 'CD AUDIO',
            addedAt: Number(item.addedAt || 0),
            palette,
            thumbUrl,
            coverUrl,
            isPlex: true
          };
        });

        badge.textContent = `PLEX LIVE • SEC ${plexConfig.section}`;
        badge.className = 'px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-400/40 font-mono text-[10px] text-emerald-300';
        showToast(`총 ${allAlbums.length}장의 앨범을 불러왔습니다.`);

        loadPlexArtistPhotos();
      } catch (err) {
        const fallbackHttpUrl = 'http://192.168.0.83:32400';
        if (plexConfig.url !== fallbackHttpUrl && plexConfig.url.includes('192-168-0-83')) {
          try {
            showToast('HTTPS 연결 실패, 로컬 HTTP 주소로 재시도 중...');
            const httpEndpoint = `${fallbackHttpUrl}/library/sections/${plexConfig.section}/all?type=9${tokenParam}`;
            const httpRes = await fetch(httpEndpoint, { headers: { Accept: 'application/json' } });
            if (httpRes.ok) {
              const httpData = await httpRes.json();
              const httpList = httpData?.MediaContainer?.Metadata || [];
              if (httpList.length) {
                plexConfig.url = fallbackHttpUrl;
                try { localStorage.setItem('spine_plex_local_cfg_v1', JSON.stringify(plexConfig)); } catch (e) {}
                const encTok = encodeURIComponent(plexConfig.token);
                allAlbums = httpList.map((item, idx) => {
                  const palette = SPINE_PALETTES[idx % SPINE_PALETTES.length];
                  const thumbPath = item.thumb || item.parentThumb || '';
                  const encodedThumb = thumbPath ? encodeURIComponent(thumbPath) : '';
                  const thumbUrl = thumbPath
                    ? `${plexConfig.url}/photo/:/transcode?width=320&height=320&minSize=1&upscale=1&url=${encodedThumb}${encTok ? `&X-Plex-Token=${encTok}` : ''}`
                    : '';
                  const coverUrl = thumbPath
                    ? `${plexConfig.url}/photo/:/transcode?width=800&height=800&minSize=1&upscale=1&url=${encodedThumb}${encTok ? `&X-Plex-Token=${encTok}` : ''}`
                    : '';
                  return {
                    id: String(item.ratingKey),
                    artist: item.parentTitle || 'Unknown Artist',
                    title: item.title || 'Untitled Album',
                    year: item.year ? String(item.year) : '',
                    label: item.studio || 'CD AUDIO',
                    addedAt: Number(item.addedAt || 0),
                    palette,
                    thumbUrl,
                    coverUrl,
                    isPlex: true
                  };
                });
                badge.textContent = `PLEX LIVE • SEC ${plexConfig.section}`;
                badge.className = 'px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-400/40 font-mono text-[10px] text-emerald-300';
                showToast(`로컬 HTTP 연결 성공 — 총 ${allAlbums.length}장의 앨범을 불러왔습니다.`);
                loadPlexArtistPhotos();
                filteredAlbums = [...allAlbums];
                buildArtistGroups();
                buildAlphaIndex();
                setUiMode('ALBUM_SPINE', { resetFilter: true });
                return;
              }
            }
          } catch (e2) {}
        }
        console.warn('Plex 연결 실패, 데모 모드로 전환:', err);
        allAlbums = [...DEMO_ALBUMS];
        badge.textContent = 'DEMO SHELF (OFFLINE)';
        badge.className = 'px-2 py-0.5 rounded bg-amber-500/20 border border-amber-400/40 font-mono text-[10px] text-amber-300';
        showToast('외부 서버 응답 대기/차단으로 기본 컬렉션을 표시합니다.');
      }

      filteredAlbums = [...allAlbums];
      buildArtistGroups();
      buildAlphaIndex();
      setUiMode('ALBUM_SPINE', { resetFilter: true });
    }

    async function loadPlexArtistPhotos() {
      try {
        const tokenParam = plexConfig.token ? `&X-Plex-Token=${encodeURIComponent(plexConfig.token)}` : '';
        const endpoint = `${plexConfig.url}/library/sections/${plexConfig.section}/all?type=8${tokenParam}`;
        const res = await fetch(endpoint, { headers: { Accept: 'application/json' } });
        if (!res.ok) return;
        const data = await res.json();
        const artists = data?.MediaContainer?.Metadata || [];
        artists.forEach(a => {
          const name = (a.title || '').trim();
          const thumbPath = a.thumb || a.art || '';
          if (name && thumbPath) {
            const photoUrl = `${plexConfig.url}/photo/:/transcode?width=360&height=360&minSize=1&upscale=1&url=${encodeURIComponent(thumbPath)}${plexConfig.token ? `&X-Plex-Token=${encodeURIComponent(plexConfig.token)}` : ''}`;
            artistPhotoMap.set(name.toLowerCase(), photoUrl);
          }
        });
        buildArtistGroups();
        if (isArtistRotaryMode()) {
          renderArtistRotaryDrum();
        }
      } catch (e) {
        console.warn('아티스트 이미지 로드 실패:', e);
      }
    }

    function buildArtistGroups() {
      const map = new Map();
      allAlbums.forEach((album, idx) => {
        const name = (album.artist || 'Unknown Artist').trim();
        if (!map.has(name)) {
          map.set(name, {
            artist: name,
            albums: [],
            palette: SPINE_PALETTES[idx % SPINE_PALETTES.length],
            artistPhotoUrl: artistPhotoMap.get(name.toLowerCase()) || ''
          });
        }
        map.get(name).albums.push(album);
      });
      artistGroups = Array.from(map.values()).sort((a, b) => a.artist.localeCompare(b.artist));
    }

    const ROTARY_POOL_SIZE = 15; // visibleHalf(7) * 2 + 1
    let rotaryPoolNodes = [];

    function ensureRotaryPool() {
      if (rotaryPoolNodes.length === ROTARY_POOL_SIZE) return;
      wheelEl.innerHTML = '';
      rotaryPoolNodes = Array.from({ length: ROTARY_POOL_SIZE }, () => {
        const slot = document.createElement('div');
        slot.className = 'rotary-slot';
        slot.innerHTML = `
          <div class="slot-jewel-edge"><span></span></div>
          <img alt="" loading="lazy" class="slot-img hidden" />
          <div class="slot-fallback w-full h-full"></div>
          <div class="slot-artist-caption hidden absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-black/95 via-black/75 to-transparent pointer-events-none">
            <div class="cap-count font-mono text-[10px] text-amber-400 font-bold tracking-wider"></div>
            <div class="cap-name text-sm font-extrabold text-white truncate"></div>
          </div>
        `;
        const img = slot.querySelector('.slot-img');
        const fb = slot.querySelector('.slot-fallback');
        img.onerror = () => {
          img.classList.add('hidden');
          fb.classList.remove('hidden');
        };
        slot.addEventListener('click', e => {
          e.stopPropagation();
          const mode = slot.dataset.slotMode;
          if (mode === 'artist') {
            handleArtistSlotClick(Number(slot.dataset.virtualPos), slot.dataset.artist);
          } else if (mode === 'album' && slot.dataset.id) {
            selectAlbum(slot.dataset.id, true);
          }
        });
        wheelEl.appendChild(slot);
        return slot;
      });
    }

    function renderArtistRotaryDrum() {
      const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
      const list = q ? artistGroups.filter(g => g.artist.toLowerCase().includes(q)) : artistGroups;
      document.getElementById('album-counter').textContent = `${list.length} ARTISTS`;
      const total = list.length;
      if (!total) {
        rotaryPoolNodes.forEach(n => { n.style.display = 'none'; });
        return;
      }

      ensureRotaryPool();
      const stageW = stageEl.clientWidth || window.innerWidth;
      const radiusX = Math.min(stageW * 0.44, 520);
      const radiusZ = Math.min(stageW * 0.34, 420);
      const visibleHalf = Math.min(7, Math.floor((total - 1) / 2));
      const centerRound = Math.round(artistRotaryIndex);

      rotaryPoolNodes.forEach((slot, poolIdx) => {
        const offset = poolIdx - 7;
        if (offset < -visibleHalf || offset > visibleHalf) {
          slot.style.display = 'none';
          return;
        }

        const virtualPos = centerRound + offset;
        const realIdx = ((virtualPos % total) + total) % total;
        const grp = list[realIdx];
        const rel = virtualPos - artistRotaryIndex;
        const isCenter = Math.abs(rel) < 0.35;

        const angleRad = rel * 0.31;
        const sinA = Math.sin(angleRad);
        const cosA = Math.cos(angleRad);

        const translateX = sinA * radiusX;
        const translateZ = (cosA - 1) * radiusZ;
        const rotateY = -sinA * 56;
        const scale = Math.max(0.64, 1 - Math.abs(rel) * 0.055);
        const opacity = Math.max(0.24, 1 - Math.abs(rel) * 0.13);
        const brightness = Math.max(0.45, 1 - Math.abs(rel) * 0.11);

        slot.style.display = 'block';
        slot.classList.toggle('ring-2', isCenter);
        slot.classList.toggle('ring-amber-400', isCenter);
        slot.dataset.slotMode = 'artist';
        slot.dataset.virtualPos = String(virtualPos);
        slot.dataset.artist = grp.artist;
        slot.title = `${grp.artist} (${grp.albums.length} Albums)`;
        slot.style.transform = `translate3d(${translateX.toFixed(1)}px, 0px, ${translateZ.toFixed(1)}px) rotateY(${rotateY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
        slot.style.opacity = opacity.toFixed(2);
        slot.style.pointerEvents = 'auto';
        slot.style.filter = `brightness(${brightness.toFixed(2)})`;
        slot.style.zIndex = String(20 - Math.round(Math.abs(rel)));

        slot.querySelector('.slot-jewel-edge').classList.add('hidden');
        const cap = slot.querySelector('.slot-artist-caption');
        cap.classList.remove('hidden');
        cap.querySelector('.cap-count').textContent = `${grp.albums.length} ALBUMS`;
        cap.querySelector('.cap-name').textContent = grp.artist;

        const img = slot.querySelector('.slot-img');
        const fb = slot.querySelector('.slot-fallback');
        const fbKey = `artist:${grp.artist}`;
        if (fb.dataset.cacheKey !== fbKey) {
          fb.dataset.cacheKey = fbKey;
          const initials = grp.artist
            .split(/\s+/)
            .slice(0, 2)
            .map(w => w.charAt(0).toUpperCase())
            .join('');
          fb.innerHTML = `
            <div class="w-full h-full flex flex-col items-center justify-center p-4" style="background: radial-gradient(circle at 35% 30%, ${grp.palette.bg}, #09090d); color:${grp.palette.fg};">
              <div class="w-24 h-24 rounded-full border-2 border-white/25 bg-black/35 flex items-center justify-center text-3xl font-black tracking-wider shadow-xl mb-3">
                ${escapeHtml(initials || '♪')}
              </div>
              <span class="font-mono text-[10px] uppercase tracking-widest opacity-65">ARTIST PROFILE</span>
            </div>
          `;
        }

        if (grp.artistPhotoUrl) {
          img.className = 'slot-img w-full h-full object-cover object-top';
          if (img.dataset.src !== grp.artistPhotoUrl) {
            img.dataset.src = grp.artistPhotoUrl;
            img.src = grp.artistPhotoUrl;
          }
          img.classList.remove('hidden');
          fb.classList.add('hidden');
        } else {
          img.classList.add('hidden');
          fb.classList.remove('hidden');
        }
      });
    }

    function handleArtistSlotClick(virtualPos, artistName) {
      if (Math.abs(virtualPos - artistRotaryIndex) > 0.35) {
        artistRotaryIndex = virtualPos;
        renderArtistRotaryDrum();
      } else {
        selectArtistFromRotary(artistName);
      }
    }

    function buildAlphaIndex() {
      const container = document.getElementById('alpha-index');
      if (!container) return;
      const letters = ['#', 'A', 'C', 'E', 'G', 'J', 'L', 'M', 'P', 'R', 'S', 'T', 'W', 'ㄱ', 'ㅅ', 'ㅇ'];
      container.innerHTML = letters
        .map(ch => `<button onclick="jumpToLetter('${ch}')" class="px-1.5 py-0.5 rounded hover:bg-white/10 hover:text-amber-300 transition">${ch}</button>`)
        .join('');
    }

    function jumpToLetter(ch) {
      toggleCornerMenu(false);
      if (isArtistRotaryMode()) {
        const idx = artistGroups.findIndex(g => {
          const first = (g.artist || '').trim().charAt(0).toUpperCase();
          return ch === '#' ? /[0-9]/.test(first) : first >= ch;
        });
        if (idx !== -1) {
          artistRotaryIndex = idx;
          renderArtistRotaryDrum();
        }
        return;
      }
      const target = filteredAlbums.find(a => {
        const first = (a.artist || '').trim().charAt(0).toUpperCase();
        if (ch === '#') return /[0-9]/.test(first);
        return first >= ch;
      });
      if (target) {
        if (isExpandedMode()) {
          selectAlbum(target.id, true);
        } else {
          previewCenterSpineAlbum(target.id, true);
        }
      }
    }

    function handleSearch(query) {
      if (isArtistRotaryMode()) {
        artistRotaryIndex = 0;
        renderArtistRotaryDrum();
        return;
      }
      const q = query.trim().toLowerCase();
      const basePool = selectedArtistName
        ? (artistGroups.find(g => g.artist === selectedArtistName)?.albums || [])
        : allAlbums;
      filteredAlbums = q
        ? basePool.filter(a => a.artist.toLowerCase().includes(q) || a.title.toLowerCase().includes(q))
        : [...basePool];
      rotaryIndex = 0;
      renderSpines(true);
      renderRotaryDrum();
      if (isSpineMode() && filteredAlbums.length > 0) {
        previewCenterSpineAlbum(filteredAlbums[0].id, false);
      }
    }

    function handleSort(mode) {
      if (mode === 'artist') {
        filteredAlbums.sort((a, b) => a.artist.localeCompare(b.artist));
      } else if (mode === 'recent') {
        filteredAlbums.sort((a, b) => b.addedAt - a.addedAt);
      } else if (mode === 'year') {
        filteredAlbums.sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0));
      } else if (mode === 'random') {
        filteredAlbums.sort(() => Math.random() - 0.5);
      }
      rotaryIndex = 0;
      renderSpines(true);
      renderRotaryDrum();
      if (filteredAlbums.length > 0) {
        if (isExpandedMode()) {
          selectAlbum(filteredAlbums[0].id, true);
        } else {
          previewCenterSpineAlbum(filteredAlbums[0].id, true);
        }
      }
    }

    const SPINE_STEP = 38; // width(34px) + gap(4px)
    let renderedSpineRange = { start: -1, end: -1 };

    function renderSpines(force = false) {
      if (!cdTrackEl || !spineViewportEl) return;
      const total = filteredAlbums.length;
      if (!total) {
        cdTrackEl.innerHTML = '';
        renderedSpineRange = { start: -1, end: -1 };
        return;
      }

      const vpW = spineViewportEl.clientWidth || window.innerWidth;
      const padLeft = vpW * 0.46;
      const scrollLeft = spineViewportEl.scrollLeft;
      const buffer = 35;

      const firstVisible = Math.max(0, Math.floor((scrollLeft - padLeft) / SPINE_STEP) - buffer);
      const lastVisible = Math.min(total - 1, Math.ceil((scrollLeft + vpW - padLeft) / SPINE_STEP) + buffer);

      if (!force && firstVisible === renderedSpineRange.start && lastVisible === renderedSpineRange.end) {
        updateSpineCenterSplit();
        return;
      }
      renderedSpineRange = { start: firstVisible, end: lastVisible };

      const leftSpacerW = firstVisible * SPINE_STEP;
      const rightSpacerW = Math.max(0, (total - 1 - lastVisible) * SPINE_STEP);
      const gap = isSpineMode() && selectedId ? getSpineCenterGap() : 0;

      let out = `<div style="width:${leftSpacerW}px; flex-shrink:0;"></div>`;
      for (let i = firstVisible; i <= lastVisible; i++) {
        const album = filteredAlbums[i];
        const isSel = album.id === selectedId;
        const marginStyle = isSel && isSpineMode() ? `margin-left:${gap}px; margin-right:${gap}px;` : '';
        out += `
          <div
            class="cd-spine ${isSel ? 'selected' : ''}"
            data-id="${album.id}"
            style="background:${album.palette.bg}; color:${album.palette.fg}; ${marginStyle}"
            onclick="handleSpineClick(event, '${album.id}')"
            title="${escapeHtml(album.artist)} — ${escapeHtml(album.title)}"
          >
            <div class="jewel-teeth"></div>
            <div class="acrylic-sheen"></div>
            <div class="spine-top-tag">${escapeHtml(album.year || 'CD')}</div>
            <div class="spine-title-wrap">
              <span class="spine-artist">${escapeHtml(album.artist)}</span>
              <span class="spine-sep">•</span>
              <span class="spine-album">${escapeHtml(album.title)}</span>
            </div>
            <div class="spine-bottom-logo">COMPACT DISC</div>
          </div>
        `;
      }
      out += `<div style="width:${rightSpacerW}px; flex-shrink:0;"></div>`;
      cdTrackEl.innerHTML = out;
    }

    let spineMoved = false;

    function handleSpineClick(e, id) {
      e.stopPropagation();
      if (spineMoved) {
        spineMoved = false;
        return;
      }
      if (selectedId === id && isSpineMode()) {
        selectAlbum(id, true, true, true);
      } else {
        previewCenterSpineAlbum(id, true);
      }
    }

    function getSpineCenterGap() {
      const stageH = stageEl.clientHeight || window.innerHeight;
      const stageW = stageEl.clientWidth || window.innerWidth;
      const cardSize = Math.min(stageH * 0.86, stageW * 0.76);
      return Math.round(cardSize / 2) + 8;
    }

    function updateSpineCenterSplit() {
      if (!cdTrackEl) return;
      const gap = isSpineMode() && selectedId ? getSpineCenterGap() : 0;
      cdTrackEl.querySelectorAll('.cd-spine').forEach(el => {
        const isSel = el.dataset.id === selectedId;
        el.classList.toggle('selected', isSel);
        if (isSel && isSpineMode()) {
          el.style.marginLeft = `${gap}px`;
          el.style.marginRight = `${gap}px`;
        } else {
          el.style.marginLeft = '0px';
          el.style.marginRight = '0px';
        }
      });
    }


    function highlightSpineOnly(id, smooth = true) {
      const idx = filteredAlbums.findIndex(a => a.id === id);
      if (idx === -1 || !cdTrackEl || !spineViewportEl) return;
      selectedId = id;
      const gap = isSpineMode() ? getSpineCenterGap() : 0;
      const padLeft = spineViewportEl.clientWidth * 0.46;
      const targetCenter = padLeft + idx * SPINE_STEP + gap + 17;
      const targetLeft = Math.max(0, targetCenter - spineViewportEl.clientWidth / 2);
      isProgrammaticSpineScroll = true;
      spineViewportEl.scrollTo({
        left: targetLeft,
        behavior: smooth ? 'smooth' : 'auto'
      });
      renderSpines(true);
      setTimeout(() => {
        isProgrammaticSpineScroll = false;
        renderSpines(true);
      }, 380);
    }

    function previewCenterSpineAlbum(id, smooth = true) {
      const idx = filteredAlbums.findIndex(a => a.id === id);
      if (idx === -1) return;
      const album = filteredAlbums[idx];

      selectedId = id;
      rotaryIndex = idx;
      currentTracks = [];
      currentTrackIdx = -1;
      highlightSpineOnly(id, smooth);

      document.getElementById('sc-artist').textContent = album.artist;
      document.getElementById('sc-title').textContent = album.title;
      document.getElementById('sc-meta').textContent = `${album.year || 'AUDIO'} • ${album.label}`;

      document.getElementById('fb-label').textContent = album.label;
      document.getElementById('fb-artist').textContent = album.artist;
      document.getElementById('fb-title').textContent = album.title;

      const imgEl = document.getElementById('showcase-cover-img');
      const fbEl = document.getElementById('showcase-cover-fallback');
      if (album.coverUrl) {
        fbEl.classList.add('hidden');
        imgEl.classList.remove('hidden');
        imgEl.src = album.coverUrl;
      } else {
        imgEl.removeAttribute('src');
        handleCoverFallback();
      }

      flipCard(false);
      showcaseEl.classList.add('active');
    }

    function renderRotaryDrum() {
      document.getElementById('album-counter').textContent = `${filteredAlbums.length} ALBUMS`;
      const total = filteredAlbums.length;
      if (!total) {
        rotaryPoolNodes.forEach(n => { n.style.display = 'none'; });
        return;
      }

      ensureRotaryPool();
      const stageW = stageEl.clientWidth || window.innerWidth;
      const radiusX = Math.min(stageW * 0.44, 520);
      const radiusZ = Math.min(stageW * 0.34, 420);
      const visibleHalf = Math.min(7, Math.floor((total - 1) / 2));
      const centerRound = Math.round(rotaryIndex);

      rotaryPoolNodes.forEach((slot, poolIdx) => {
        const offset = poolIdx - 7;
        if (offset < -visibleHalf || offset > visibleHalf) {
          slot.style.display = 'none';
          return;
        }

        const virtualPos = centerRound + offset;
        const realIdx = ((virtualPos % total) + total) % total;
        const album = filteredAlbums[realIdx];
        const rel = virtualPos - rotaryIndex;

        const spreadBonus = isExpandedMode() ? (isLyricsOpen ? 235 : 125) : 0;
        const angleRad = rel * 0.31;
        const sinA = Math.sin(angleRad);
        const cosA = Math.cos(angleRad);

        const translateX = sinA * radiusX + (rel === 0 ? 0 : Math.sign(rel) * spreadBonus * Math.min(1, Math.abs(rel)));
        const translateZ = (cosA - 1) * radiusZ - (isExpandedMode() ? 140 : 0);
        const rotateY = -sinA * 56;
        const scale = Math.max(0.64, 1 - Math.abs(rel) * 0.055);
        const isHiddenCenter = isExpandedMode() && Math.abs(rel) < 0.45;
        const disableSlotPointer = isHiddenCenter || (isExpandedMode() && isLyricsOpen);
        const opacity = isHiddenCenter ? 0 : Math.max(0.22, 1 - Math.abs(rel) * 0.13);
        const brightness = Math.max(0.45, 1 - Math.abs(rel) * 0.11);

        slot.style.display = 'block';
        slot.classList.remove('ring-2', 'ring-amber-400');
        slot.dataset.slotMode = 'album';
        slot.dataset.id = album.id;
        slot.title = `${album.artist} — ${album.title}`;
        slot.style.transform = `translate3d(${translateX.toFixed(1)}px, 0px, ${translateZ.toFixed(1)}px) rotateY(${rotateY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
        slot.style.opacity = opacity.toFixed(2);
        slot.style.pointerEvents = disableSlotPointer ? 'none' : 'auto';
        slot.style.filter = `brightness(${brightness.toFixed(2)})`;
        slot.style.zIndex = String(20 - Math.round(Math.abs(rel)));

        const jewelEdge = slot.querySelector('.slot-jewel-edge');
        jewelEdge.classList.remove('hidden');
        jewelEdge.firstElementChild.textContent = album.artist;
        slot.querySelector('.slot-artist-caption').classList.add('hidden');

        const img = slot.querySelector('.slot-img');
        const fb = slot.querySelector('.slot-fallback');
        const fbKey = `album:${album.id}`;
        if (fb.dataset.cacheKey !== fbKey) {
          fb.dataset.cacheKey = fbKey;
          fb.innerHTML = `<div class="w-full h-full flex flex-col justify-between p-4 pl-6" style="background:${album.palette.bg}; color:${album.palette.fg};">
            <span class="font-mono text-[10px] opacity-70">${escapeHtml(album.year || 'CD')}</span>
            <div>
              <div class="text-xs font-bold opacity-85 truncate">${escapeHtml(album.artist)}</div>
              <div class="text-sm font-extrabold leading-tight line-clamp-2 mt-1">${escapeHtml(album.title)}</div>
            </div>
          </div>`;
        }

        const slotArtUrl = album.thumbUrl || album.coverUrl;
        if (slotArtUrl) {
          img.className = 'slot-img';
          if (img.dataset.src !== slotArtUrl) {
            img.dataset.src = slotArtUrl;
            img.src = slotArtUrl;
          }
          img.classList.remove('hidden');
          fb.classList.add('hidden');
        } else {
          img.classList.add('hidden');
          fb.classList.remove('hidden');
        }
      });
    }

    function stepRotary(delta) {
      if (isArtistRotaryMode()) {
        if (!artistGroups.length) return;
        artistRotaryIndex = Math.round(artistRotaryIndex) + delta;
        renderArtistRotaryDrum();
        return;
      }
      if (!filteredAlbums.length) return;
      const total = filteredAlbums.length;
      const targetPos = Math.round(rotaryIndex) + delta;
      const targetIdx = ((targetPos % total) + total) % total;
      rotaryIndex = targetPos;
      selectAlbum(filteredAlbums[targetIdx].id, true, false, false);
    }

    function flipCard(toBack) {
      const cardEl = document.getElementById('showcase-card');
      if (!cardEl) return;
      cardEl.classList.toggle('flipped', Boolean(toBack));
    }

    async function handleFrontCoverClick() {
      if (!selectedId) return;
      const album = filteredAlbums.find(a => a.id === selectedId);
      if (!album) return;

      if (!isExpandedMode()) {
        await selectAlbum(selectedId, true, true, true);
      } else {
        flipCard(true);
        if (!currentTracks.length) {
          await fetchAlbumTracks(album);
        }
      }
    }

    function toggleLyricsBooklet(forceState) {
      isLyricsOpen = typeof forceState === 'boolean' ? forceState : !isLyricsOpen;
      if (!isLyricsOpen) {
        if (isBookletMenuOpen) toggleBookletHeaderMenu(false);
        if (isBookletFullscreen) toggleBookletFullscreen(false);
      }
      showcaseEl.classList.toggle('has-lyrics', isLyricsOpen);
      renderRotaryDrum();
      if (isLyricsOpen && bookletViewMode !== 'lyrics') {
        initWebAudioAnalyser();
        startVisualizerLoop();
        setTimeout(resizeVisualizerCanvas, 60);
        setTimeout(resizeVisualizerCanvas, 400);
      } else {
        stopVisualizerLoop();
      }
    }

    function toggleBookletFullscreen(forceState) {
      isBookletFullscreen = typeof forceState === 'boolean' ? forceState : !isBookletFullscreen;
      const bookletEl = document.getElementById('lyrics-booklet');
      const deviceEl = document.getElementById('spine-device');
      const showcaseContainer = document.getElementById('expanded-showcase');
      const fsBtn = document.getElementById('booklet-fullscreen-btn');
      if (bookletEl) {
        if (isBookletFullscreen && deviceEl) {
          deviceEl.appendChild(bookletEl);
        } else if (!isBookletFullscreen && showcaseContainer && bookletEl.parentElement !== showcaseContainer) {
          showcaseContainer.appendChild(bookletEl);
        }
        bookletEl.classList.toggle('visualizer-fullscreen', isBookletFullscreen);
      }
      if (fsBtn) {
        fsBtn.textContent = isBookletFullscreen ? '🗗' : '⛶';
        fsBtn.title = isBookletFullscreen ? '원래 크기로 복원 (ESC)' : '비주얼라이저 전체화면 전환';
      }
      setTimeout(resizeVisualizerCanvas, 30);
    }

    // 우측 CD 부클릿 뷰 모드 전환 ('lyrics' | 'scope' | 'vu' | 'aurora' | 'disc')
    // 우측 CD 부클릿 뷰 모드 전환
    function setBookletViewMode(mode) {
      bookletViewMode = mode;
      const lyricsBox = document.getElementById('lyrics-lines-box');
      const vizBox = document.getElementById('booklet-visualizer-box');
      const syncControls = document.getElementById('lyrics-sync-controls');
      const fsBtn = document.getElementById('booklet-fullscreen-btn');
      const badge = document.getElementById('lyrics-sync-badge');

      const allModes = ['lyrics', 'scope', 'vu', 'aurora', 'disc', 'reel', 'tube', 'phase', 'matrix', 'ripple'];
      const activeBtnClass = 'py-1 rounded-md font-mono text-[9px] font-bold bg-amber-400 text-zinc-950 transition';
      const inactiveBtnClass = 'py-1 rounded-md font-mono text-[9px] font-bold text-zinc-300 hover:text-white transition';

      allModes.forEach(m => {
        const btn = document.getElementById(`booklet-mode-${m}`);
        if (btn) btn.className = mode === m ? activeBtnClass : inactiveBtnClass;
      });

      if (mode === 'lyrics') {
        stopVisualizerLoop();
        if (isBookletFullscreen) toggleBookletFullscreen(false);
        if (fsBtn) fsBtn.classList.add('hidden');
        if (lyricsBox) lyricsBox.classList.remove('hidden');
        if (vizBox) vizBox.classList.add('hidden');
        if (syncControls) syncControls.classList.remove('hidden');
        if (badge) badge.textContent = 'LYRICS';
      } else {
        if (fsBtn) fsBtn.classList.remove('hidden');
        if (lyricsBox) lyricsBox.classList.add('hidden');
        if (vizBox) vizBox.classList.remove('hidden');
        if (syncControls) syncControls.classList.add('hidden');
        const badgeLabels = {
          scope: 'SCOPE',
          vu: 'VU METER',
          aurora: 'AURORA',
          disc: 'DISC',
          reel: 'REEL DECK',
          tube: 'VACUUM TUBE',
          phase: 'LISSAJOUS',
          matrix: 'LED MATRIX',
          ripple: 'RIPPLE'
        };
        if (badge) badge.textContent = badgeLabels[mode] || 'VISUALIZER';
        initWebAudioAnalyser();
        resizeVisualizerCanvas();
        if (isLyricsOpen) startVisualizerLoop();
      }
      toggleBookletHeaderMenu(false);
    }

    function shiftLyricsOffset(delta) {
      lyricsOffset = Number((lyricsOffset + delta).toFixed(1));
      showToast(`가사 싱크 조절: ${lyricsOffset > 0 ? '+' : ''}${lyricsOffset}초`);
    }

    function handleCoverFallback() {
      const imgEl = document.getElementById('showcase-cover-img');
      const fbEl = document.getElementById('showcase-cover-fallback');
      if (imgEl) imgEl.classList.add('hidden');
      if (fbEl) fbEl.classList.remove('hidden');
    }

    const coverImgNode = document.getElementById('showcase-cover-img');
    if (coverImgNode) {
      coverImgNode.addEventListener('error', () => {
        if (coverImgNode.getAttribute('src')) {
          handleCoverFallback();
        }
      });
    }

    function collapseShowcase() {
      const returnMode = selectedArtistName ? 'ARTIST_ALBUMS_SPINE' : 'ALBUM_SPINE';
      setUiMode(returnMode, { albumId: selectedId, smooth: true });
    }

    function enterRotaryMode(id) {
      selectAlbum(id || selectedId, true, true, true);
    }

    async function selectAlbum(id, smooth = true, alignRotary = true, openBack = false) {
      const idx = filteredAlbums.findIndex(a => a.id === id);
      if (idx === -1) return;
      const album = filteredAlbums[idx];

      if (!isExpandedMode()) {
        rotaryIndex = idx;
      } else if (alignRotary && filteredAlbums.length > 0) {
        const total = filteredAlbums.length;
        const curMod = ((Math.round(rotaryIndex) % total) + total) % total;
        let diff = idx - curMod;
        if (diff > total / 2) diff -= total;
        if (diff < -total / 2) diff += total;
        rotaryIndex = Math.round(rotaryIndex) + diff;
      }

      selectedId = id;
      uiMode = 'ALBUM_ROTARY';
      updateHeaderModeUI();
      stageEl.classList.add('rotary-mode');
      updateSpineCenterSplit();
      flipCard(openBack);
      renderRotaryDrum();

      document.getElementById('sc-artist').textContent = album.artist;
      document.getElementById('sc-title').textContent = album.title;
      document.getElementById('sc-meta').textContent = `${album.year || 'AUDIO'} • ${album.label}`;

      document.getElementById('fb-label').textContent = album.label;
      document.getElementById('fb-artist').textContent = album.artist;
      document.getElementById('fb-title').textContent = album.title;

      const imgEl = document.getElementById('showcase-cover-img');
      const fbEl = document.getElementById('showcase-cover-fallback');
      if (album.coverUrl) {
        fbEl.classList.add('hidden');
        imgEl.classList.remove('hidden');
        imgEl.src = album.coverUrl;
      } else {
        imgEl.removeAttribute('src');
        handleCoverFallback();
      }

      showcaseEl.classList.add('active');
      await fetchAlbumTracks(album);
    }

    async function fetchAlbumTracks(album) {
      const tracksContainer = document.getElementById('sc-tracks');
      tracksContainer.innerHTML = `<div class="text-xs text-zinc-400 py-4 text-center">트랙 목록 불러오는 중...</div>`;

      if (album.isPlex) {
        try {
          const url = `${plexConfig.url}/library/metadata/${album.id}/children${plexConfig.token ? `?X-Plex-Token=${encodeURIComponent(plexConfig.token)}` : ''}`;
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!res.ok) throw new Error('트랙 조회 실패');
          const data = await res.json();
          const items = data?.MediaContainer?.Metadata || [];

          currentTracks = items.map((t, i) => {
            const part = t?.Media?.[0]?.Part?.[0];
            const partKey = part?.key || '';
            const streams = part?.Stream || [];
            const lyricStream = streams.find(s => String(s.streamType) === '4' || s.codec === 'lrc' || s.codec === 'txt');
            return {
              index: t.index || i + 1,
              title: t.title || `Track ${i + 1}`,
              artist: t.grandparentTitle || album.artist,
              durationMs: t.duration || 0,
              duration: formatDuration(t.duration || 0),
              streamUrl: partKey ? `${plexConfig.url}${partKey}${plexConfig.token ? `?X-Plex-Token=${encodeURIComponent(plexConfig.token)}` : ''}` : '',
              lyricUrl: lyricStream?.key ? `${plexConfig.url}${lyricStream.key}${plexConfig.token ? `?X-Plex-Token=${encodeURIComponent(plexConfig.token)}` : ''}` : ''
            };
          });
          renderTracks();
          return;
        } catch (e) {
          console.warn('트랙 로드 실패:', e);
        }
      }

      currentTracks = [
        { index: 1, title: 'Opening Theme (Remastered)', artist: album.artist, durationMs: 222000, duration: '3:42', streamUrl: '', demoLyrics: '[00:04.00] Opening theme begins\n[00:10.00] Spinning the rotary jukebox' },
        { index: 2, title: 'Midnight Groove', artist: album.artist, durationMs: 258000, duration: '4:18', streamUrl: '', demoLyrics: '[00:05.00] Midnight groove on the turntable' },
        { index: 3, title: 'Analog Memories', artist: album.artist, durationMs: 235000, duration: '3:55', streamUrl: '', demoLyrics: '[00:05.00] Warm analog sound' }
      ];
      renderTracks();
    }

    function renderTracks() {
      const tracksContainer = document.getElementById('sc-tracks');
      tracksContainer.innerHTML = currentTracks
        .map((tr, idx) => {
          const active = idx === currentTrackIdx;
          return `
            <div
              onclick="playTrack(${idx})"
              class="flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition ${
                active
                  ? 'bg-amber-400/20 border border-amber-400/40 text-amber-300'
                  : 'hover:bg-white/10 active:bg-white/15 text-zinc-200'
              }"
            >
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="font-mono text-xs w-5 text-zinc-400">${tr.index}</span>
                <span class="text-sm font-medium truncate">${escapeHtml(tr.title)}</span>
              </div>
              <span class="font-mono text-xs text-zinc-400 ml-2">${tr.duration}</span>
            </div>
          `;
        })
        .join('');
    }

    function playTrack(idx) {
      const tr = currentTracks[idx];
      if (!tr) return;
      currentTrackIdx = idx;
      renderTracks();

      flipCard(false);
      const playingBar = document.getElementById('cover-playing-bar');
      if (playingBar) playingBar.classList.add('visible');
      const lyricsPlayingBar = document.getElementById('lyrics-playing-bar');
      if (lyricsPlayingBar) lyricsPlayingBar.classList.add('visible');

      const activeAlbum = filteredAlbums.find(a => a.id === selectedId);
      const titleText = `${tr.index}. ${tr.title}`;
      const artistText = activeAlbum ? `${activeAlbum.artist} — ${activeAlbum.title}` : '';
      document.getElementById('now-playing-title').textContent = titleText;
      document.getElementById('now-playing-artist').textContent = artistText;
      document.getElementById('lyrics-now-playing-title').textContent = titleText;
      document.getElementById('lyrics-now-playing-artist').textContent = artistText;

      document.getElementById('lyrics-track-name').textContent = tr.title;
      toggleLyricsBooklet(true);
      lyricsOffset = 0;
      loadTrackLyrics(activeAlbum, tr);

      if (tr.streamUrl) {
        zeroSignalFrames = 0;
        forceSynthVisualizer = false;
        initWebAudioAnalyser();
        audioEl.crossOrigin = 'anonymous';
        audioEl.src = tr.streamUrl;
        audioEl.play().catch(err => {
          if (audioEl.crossOrigin) {
            audioEl.removeAttribute('crossorigin');
            audioEl.src = tr.streamUrl;
            audioEl.play().catch(() => showToast('브라우저 자동 재생 정책으로 재생 버튼을 눌러주세요.'));
          } else {
            showToast('브라우저 자동 재생 정책으로 재생 버튼을 눌러주세요.');
          }
        });
        document.getElementById('play-pause-btn').textContent = '⏸';
        document.getElementById('lyrics-play-pause-btn').textContent = '⏸';
      } else {
        showToast(`데모 트랙 선택됨: ${tr.title}`);
      }
    }

    async function loadTrackLyrics(album, tr) {
      const box = document.getElementById('lyrics-lines-box');
      const badge = document.getElementById('lyrics-sync-badge');
      box.innerHTML = '<div class="text-xs text-zinc-400 text-center py-10">가사 불러오는 중...</div>';
      parsedLyrics = [];

      let rawText = tr.demoLyrics || '';
      if (!rawText && tr.lyricUrl) {
        try {
          const res = await fetch(tr.lyricUrl);
          if (res.ok) rawText = await res.text();
        } catch (e) {}
      }

      if (!/\[\d{1,2}:\d{2}/.test(rawText)) {
        try {
          const cleanTitle = tr.title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
          const artistQ = encodeURIComponent(tr.artist || album?.artist || '');
          const titleQ = encodeURIComponent(cleanTitle);
          const lrcRes = await fetch(`https://lrclib.net/api/get?artist_name=${artistQ}&track_name=${titleQ}`);
          if (lrcRes.ok) {
            const lrcData = await lrcRes.json();
            if (lrcData.syncedLyrics) rawText = lrcData.syncedLyrics;
            else if (!rawText && lrcData.plainLyrics) rawText = lrcData.plainLyrics;
          }
        } catch (e) {}
      }

      if (!rawText) {
        if (bookletViewMode === 'lyrics') badge.textContent = 'NO LYRICS';
        box.innerHTML = '<div class="text-xs text-zinc-500 text-center py-10">등록된 가사가 없는 트랙입니다.</div>';
        return;
      }

      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const timeRegex = /^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]\s*(.*)$/;
      const hasSync = lines.some(l => timeRegex.test(l));

      if (hasSync) {
        if (bookletViewMode === 'lyrics') badge.textContent = 'SYNCED LRC';
        lines.forEach(line => {
          const m = line.match(timeRegex);
          if (m) {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
            parsedLyrics.push({ time: min * 60 + sec + ms / 1000, text: m[4] || '♪' });
          }
        });
      } else {
        if (bookletViewMode === 'lyrics') badge.textContent = 'AUTO SYNC';
        const totalSec = Math.max(30, (tr.durationMs || 180000) / 1000);
        const step = totalSec / Math.max(1, lines.length);
        lines.forEach((txt, i) => parsedLyrics.push({ time: i * step, text: txt }));
      }

      box.innerHTML = parsedLyrics
        .map((item, idx) => `<div class="lyric-line" data-idx="${idx}" onclick="jumpToLyric(${item.time})">${escapeHtml(item.text)}</div>`)
        .join('');
    }

    function jumpToLyric(timeSec) {
      if (audioEl.duration) {
        audioEl.currentTime = Math.max(0, timeSec - lyricsOffset);
      }
    }

    function updateLyricsHighlight(curSec, totalSec) {
      if (!parsedLyrics.length) return;
      const t = curSec + lyricsOffset;
      let activeIdx = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (t >= parsedLyrics[i].time) activeIdx = i;
        else break;
      }

      const container = document.getElementById('lyrics-lines-box');
      const lineEls = container ? container.querySelectorAll('.lyric-line') : [];
      lineEls.forEach((el, idx) => {
        if (idx === activeIdx) {
          const start = parsedLyrics[idx].time;
          const end = parsedLyrics[idx + 1] ? parsedLyrics[idx + 1].time : (totalSec || start + 4);
          const progress = Math.max(0, Math.min(1, (t - start) / Math.max(0.5, end - start)));
          el.style.setProperty('--line-progress', progress.toFixed(3));
          if (!el.classList.contains('active')) {
            el.classList.add('active');
            if (container) {
              const targetScrollTop = el.offsetTop - (container.clientHeight / 2) + (el.clientHeight / 2);
              container.scrollTo({
                top: Math.max(0, targetScrollTop),
                behavior: 'smooth'
              });
            }
          }
        } else {
          el.classList.remove('active');
          el.style.removeProperty('--line-progress');
        }
      });
    }

    function togglePlayPause() {
      if (!audioEl.src) {
        if (currentTracks.length > 0) playTrack(0);
        return;
      }
      if (audioEl.paused) {
        initWebAudioAnalyser();
        audioEl.play();
        document.getElementById('play-pause-btn').textContent = '⏸';
        document.getElementById('lyrics-play-pause-btn').textContent = '⏸';
      } else {
        audioEl.pause();
        document.getElementById('play-pause-btn').textContent = '▶';
        document.getElementById('lyrics-play-pause-btn').textContent = '▶';
      }
    }

    function prevTrack() {
      if (currentTracks.length === 0) return;
      const nextIdx = currentTrackIdx > 0 ? currentTrackIdx - 1 : currentTracks.length - 1;
      playTrack(nextIdx);
    }

    function nextTrack() {
      if (currentTracks.length === 0) return;
      const nextIdx = (currentTrackIdx + 1) % currentTracks.length;
      playTrack(nextIdx);
    }

    function seekAudio(e) {
      if (!audioEl.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audioEl.currentTime = ratio * audioEl.duration;
    }

    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.duration) return;
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      const timeStr = formatDuration(audioEl.currentTime * 1000);
      const progEl = document.getElementById('audio-progress');
      const timeEl = document.getElementById('audio-time');
      const lyricsProgEl = document.getElementById('lyrics-audio-progress');
      const lyricsTimeEl = document.getElementById('lyrics-audio-time');
      if (progEl) progEl.style.width = `${pct}%`;
      if (timeEl) timeEl.textContent = timeStr;
      if (lyricsProgEl) lyricsProgEl.style.width = `${pct}%`;
      if (lyricsTimeEl) lyricsTimeEl.textContent = timeStr;
      updateLyricsHighlight(audioEl.currentTime, audioEl.duration);
    });

    audioEl.addEventListener('ended', () => nextTrack());
    audioEl.addEventListener('error', () => {
      document.getElementById('play-pause-btn').textContent = '▶';
      document.getElementById('lyrics-play-pause-btn').textContent = '▶';
      showToast('오디오 스트림을 불러올 수 없습니다. Plex 서버 연결 또는 네트워크를 확인하세요.');
    });

    function formatDuration(ms) {
      const totalSec = Math.floor((ms || 0) / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = String(totalSec % 60).padStart(2, '0');
      return `${min}:${sec}`;
    }

    function sanitizeDisplayText(str) {
      let s = String(str || '');
      // 비정상 제어문자나 연속 대체문자(U+FFFD)가 포함된 문자열 정제
      if (s.includes('\uFFFD')) {
        s = s.replace(/\uFFFD+/g, '?');
      }
      return s;
    }

    function escapeHtml(str) {
      return sanitizeDisplayText(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* =========================================================================
       오디오 비주얼라이저 엔진 (CRT 오실로스코프 & 듀얼 아날로그 VU & 오로라 & 바이닐 디스크)
       ========================================================================= */
    let audioCtx = null;
    let analyserNode = null;
    let analyserL = null;
    let analyserR = null;
    let timeDataArray = null;
    let freqDataArray = null;
    let timeDataL = null;
    let timeDataR = null;
    let webAudioConnected = false;
    let zeroSignalFrames = 0;
    let forceSynthVisualizer = false;

    // Safari / 구형 iPadOS 호환용 Canvas roundRect 폴리필
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
        const rList = Array.isArray(radii) ? radii : [radii || 0];
        const tl = rList[0] ?? 0;
        const tr = rList[1] ?? tl;
        const br = rList[2] ?? tl;
        const bl = rList[3] ?? tr;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
      };
    }

    let vuNeedleL = 0;
    let vuNeedleR = 0;
    let vuPeakHoldL = 0;
    let vuPeakHoldR = 0;
    let vuPeakTimerL = 0;
    let vuPeakTimerR = 0;

    const auroraParticles = Array.from({ length: 36 }, (_, i) => ({
      x: (i * 0.6180339) % 1,
      y: (i * 0.381966) % 1,
      r: 0.8 + (i % 3) * 0.65,
      speed: 0.015 + (i % 5) * 0.006,
      phase: i * 1.1
    }));
    let vinylRotation = 0;
    let smoothedRadialBands = new Float32Array(64);
    let reelAngleL = 0;
    let reelAngleR = 0;
    const matrixPeaks = new Float32Array(24);
    const matrixHoldTimers = new Float32Array(24);
    const waterRipples = [];
    let lastRippleSpawnTime = 0;

    function initWebAudioAnalyser() {
      try {
        if (!audioCtx) {
          const AudioContextCls = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCls) return;
          audioCtx = new AudioContextCls();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!webAudioConnected) {
          const source = audioCtx.createMediaElementSource(audioEl);
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 512;
          analyserNode.smoothingTimeConstant = 0.78;

          const splitter = audioCtx.createChannelSplitter(2);
          analyserL = audioCtx.createAnalyser();
          analyserR = audioCtx.createAnalyser();
          analyserL.fftSize = 256;
          analyserR.fftSize = 256;

          source.connect(analyserNode);
          source.connect(splitter);
          splitter.connect(analyserL, 0);
          splitter.connect(analyserR, 1);
          analyserNode.connect(audioCtx.destination);

          timeDataArray = new Uint8Array(analyserNode.frequencyBinCount);
          freqDataArray = new Uint8Array(analyserNode.frequencyBinCount);
          timeDataL = new Uint8Array(analyserL.frequencyBinCount);
          timeDataR = new Uint8Array(analyserR.frequencyBinCount);
          webAudioConnected = true;
        }
      } catch (e) {
        console.warn('WebAudio 연결 제한, 합성 파형 모드 동작:', e);
      }
    }

    function resizeVisualizerCanvas() {
      const box = document.getElementById('booklet-visualizer-box');
      const canvas = document.getElementById('booklet-visualizer-canvas');
      if (!box || !canvas || box.classList.contains('hidden')) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = box.clientWidth;
      const h = box.clientHeight;
      if (w > 0 && h > 0) {
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }
    }

    const vizBoxNode = document.getElementById('booklet-visualizer-box');
    if (vizBoxNode && typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => resizeVisualizerCanvas()).observe(vizBoxNode);
    }

    function sampleAudioMetrics(nowSec) {
      const isPlaying = !audioEl.paused && !audioEl.ended && audioEl.currentTime > 0;
      let hasLiveSignal = false;
      let wave = new Float32Array(128);
      let spectrum = new Float32Array(32);
      let rmsL = 0;
      let rmsR = 0;

      if (webAudioConnected && analyserNode && isPlaying && !forceSynthVisualizer) {
        analyserNode.getByteTimeDomainData(timeDataArray);
        analyserNode.getByteFrequencyData(freqDataArray);
        analyserL.getByteTimeDomainData(timeDataL);
        analyserR.getByteTimeDomainData(timeDataR);

        let sumSqL = 0;
        let sumSqR = 0;
        for (let i = 0; i < timeDataL.length; i++) {
          const vL = (timeDataL[i] - 128) / 128;
          const vR = (timeDataR[i] - 128) / 128;
          sumSqL += vL * vL;
          sumSqR += vR * vR;
        }
        const rawRmsL = Math.sqrt(sumSqL / timeDataL.length);
        const rawRmsR = Math.sqrt(sumSqR / timeDataR.length);

        if (rawRmsL > 0.002 || rawRmsR > 0.002) {
          zeroSignalFrames = 0;
          hasLiveSignal = true;
          const shapedL = Math.pow(Math.min(1, rawRmsL * 2.1), 1.35);
          const shapedR = Math.pow(Math.min(1, rawRmsR * 2.1), 1.35);
          const beatModL = 0.82 + 0.34 * Math.abs(Math.sin(nowSec * 6.8));
          const beatModR = 0.82 + 0.34 * Math.abs(Math.cos(nowSec * 7.5 + 0.6));
          rmsL = Math.min(1.02, shapedL * beatModL);
          rmsR = Math.min(1.02, shapedR * beatModR);

          for (let i = 0; i < 128; i++) {
            const idx = Math.floor((i / 128) * timeDataArray.length);
            wave[i] = ((timeDataArray[idx] - 128) / 128) * 1.45;
          }
          for (let i = 0; i < 32; i++) {
            const idx = Math.floor((i / 32) * (freqDataArray.length * 0.75));
            spectrum[i] = Math.min(1, (freqDataArray[idx] / 255) * 1.25);
          }
        } else {
          zeroSignalFrames++;
          if (zeroSignalFrames > 30) {
            forceSynthVisualizer = true;
          }
        }
      }

      if (!hasLiveSignal) {
        if (isPlaying || currentTrackIdx >= 0 || (isLyricsOpen && bookletViewMode !== 'lyrics')) {
          const activeFactor = isPlaying ? 1.0 : 0.18;
          const beatPulseL = Math.pow(Math.max(0, Math.sin(nowSec * 5.2)), 2.2);
          const beatPulseR = Math.pow(Math.max(0, Math.sin(nowSec * 5.2 + 0.85)), 2.0);
          const subGroove = 0.5 + 0.5 * Math.sin(nowSec * 2.3);
          const hiHat = Math.abs(Math.sin(nowSec * 12.4)) * 0.16;

          rmsL = Math.min(0.98, (0.24 + beatPulseL * 0.56 + subGroove * 0.14) * activeFactor);
          rmsR = Math.min(0.98, (0.22 + beatPulseR * 0.54 + hiHat + subGroove * 0.12) * activeFactor);

          for (let i = 0; i < 128; i++) {
            const t = i / 128;
            const env = Math.sin(t * Math.PI);
            const s1 = Math.sin(t * 14 + nowSec * 9.5) * 0.45;
            const s2 = Math.sin(t * 31 - nowSec * 15) * 0.25;
            const s3 = Math.cos(t * 7 + nowSec * 4.2) * 0.3;
            wave[i] = (s1 + s2 + s3) * env * (0.35 + beatPulseL * 0.75) * activeFactor;
          }
          for (let i = 0; i < 32; i++) {
            const bandFalloff = Math.exp(-i * 0.055);
            const bounce = Math.abs(Math.sin(nowSec * (4.2 + i * 0.35) + i));
            spectrum[i] = Math.min(1, bandFalloff * (0.3 + bounce * 0.75) * activeFactor);
          }
        }
      }

      return { wave, spectrum, rmsL, rmsR, isPlaying: isPlaying || currentTrackIdx >= 0 };
    }

    // 1) CRT 오실로스코프 & 스펙트럼 애널라이저
    function drawOscilloscope(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 10, w * 0.5, h * 0.45, Math.max(w, h) * 0.75);
      bgGrad.addColorStop(0, '#14171f');
      bgGrad.addColorStop(1, '#07080b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const scopeH = h * 0.72;
      const specTop = scopeH + 6;
      const specH = h - specTop - 10;

      ctx.strokeStyle = 'rgba(251, 191, 36, 0.09)';
      ctx.lineWidth = 1;
      const cols = 10;
      const rows = 6;
      for (let c = 1; c < cols; c++) {
        const x = (w / cols) * c;
        ctx.beginPath();
        ctx.moveTo(x, 8);
        ctx.lineTo(x, scopeH);
        ctx.stroke();
      }
      for (let r = 1; r < rows; r++) {
        const y = 8 + ((scopeH - 8) / rows) * r;
        ctx.beginPath();
        ctx.moveTo(10, y);
        ctx.lineTo(w - 10, y);
        ctx.stroke();
      }

      const midY = 8 + (scopeH - 8) * 0.5;
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.22)';
      ctx.beginPath();
      ctx.moveTo(10, midY);
      ctx.lineTo(w - 10, midY);
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      const padX = 12;
      const drawW = w - padX * 2;
      const amp = (scopeH - 24) * 0.44;
      for (let i = 0; i < metrics.wave.length; i++) {
        const x = padX + (i / (metrics.wave.length - 1)) * drawW;
        const y = midY + metrics.wave[i] * amp;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.2;
      ctx.shadowColor = 'rgba(251, 191, 36, 0.85)';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.restore();

      const barCount = metrics.spectrum.length;
      const barGap = 3;
      const barW = Math.max(2, (drawW - barGap * (barCount - 1)) / barCount);
      for (let i = 0; i < barCount; i++) {
        const val = metrics.spectrum[i];
        const bH = Math.max(2, val * specH);
        const bx = padX + i * (barW + barGap);
        const by = specTop + specH - bH;

        const barGrad = ctx.createLinearGradient(0, by, 0, specTop + specH);
        barGrad.addColorStop(0, val > 0.78 ? '#f87171' : '#fde68a');
        barGrad.addColorStop(1, 'rgba(245, 158, 11, 0.25)');
        ctx.fillStyle = barGrad;
        ctx.fillRect(bx, by, barW, bH);
      }

      ctx.fillStyle = 'rgba(251, 191, 36, 0.55)';
      ctx.font = '700 9px "JetBrains Mono", monospace';
      ctx.fillText(`CH1+2 • ${metrics.isPlaying ? 'LIVE SIGNAL' : 'STANDBY'}`, 14, 19);
    }

    // 2) 매킨토시(McIntosh) 오디오 감성 아날로그 듀얼 VU 레벨 미터
    function drawSingleVuMeter(ctx, boxX, boxY, boxW, boxH, channelLabel, needleVal, peakVal) {
      if (boxW < 24 || boxH < 24) return;
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 10);
      ctx.clip();

      // 매킨토시 특유의 딥 블루 백라이트 유리창 그라디언트
      const faceGrad = ctx.createRadialGradient(
        boxX + boxW * 0.5,
        boxY + boxH * 0.85,
        Math.max(4, boxW * 0.08),
        boxX + boxW * 0.5,
        boxY + boxH * 0.5,
        Math.max(12, boxW * 0.72)
      );
      faceGrad.addColorStop(0, '#0c4a6e');
      faceGrad.addColorStop(0.55, '#072a4a');
      faceGrad.addColorStop(1, '#031224');
      ctx.fillStyle = faceGrad;
      ctx.fillRect(boxX, boxY, boxW, boxH);

      // 유리 패널 은은한 상단 반사광
      const glassGrad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH * 0.45);
      glassGrad.addColorStop(0, 'rgba(186, 230, 253, 0.14)');
      glassGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
      ctx.fillStyle = glassGrad;
      ctx.fillRect(boxX, boxY, boxW, boxH * 0.45);

      const pivotX = boxX + boxW * 0.5;
      const pivotY = boxY + boxH * 1.12;
      const radius = Math.max(16, Math.min(boxW * 0.66, boxH * 0.94));
      const startAngle = -Math.PI * 0.74;
      const endAngle = -Math.PI * 0.26;
      const zeroAngle = startAngle + (endAngle - startAngle) * 0.72;

      // 눈금 아크 (0dB 이하: 매킨토시 시안/아이스블루 발광, 0dB 이상: 레드)
      ctx.save();
      ctx.shadowColor = 'rgba(56, 189, 248, 0.65)';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, radius, startAngle, zeroAngle);
      ctx.stroke();

      ctx.shadowColor = 'rgba(248, 113, 113, 0.75)';

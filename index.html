      ctx.strokeStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, radius, zeroAngle, endAngle);
      ctx.stroke();
      ctx.restore();

      const ticks = [
        { pos: 0.0, label: '-20', red: false },
        { pos: 0.24, label: '-10', red: false },
        { pos: 0.44, label: '-5', red: false },
        { pos: 0.58, label: '-3', red: false },
        { pos: 0.72, label: '0', red: false },
        { pos: 0.86, label: '+1', red: true },
        { pos: 1.0, label: '+3', red: true }
      ];

      ctx.font = '700 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ticks.forEach(tk => {
        const ang = startAngle + (endAngle - startAngle) * tk.pos;
        const rIn = radius - 6;
        const rOut = radius + 5;
        ctx.strokeStyle = tk.red ? '#f87171' : '#bae6fd';
        ctx.lineWidth = tk.pos === 0.72 ? 2.2 : 1.4;
        ctx.beginPath();
        ctx.moveTo(pivotX + Math.cos(ang) * rIn, pivotY + Math.sin(ang) * rIn);
        ctx.lineTo(pivotX + Math.cos(ang) * rOut, pivotY + Math.sin(ang) * rOut);
        ctx.stroke();

        const rTxt = radius + 14;
        ctx.fillStyle = tk.red ? '#fca5a5' : '#e0f2fe';
        ctx.fillText(tk.label, pivotX + Math.cos(ang) * rTxt, pivotY + Math.sin(ang) * rTxt);
      });

      // 매킨토시 시그니처 그린/아이스블루 발광 로고 표기
      ctx.save();
      ctx.shadowColor = 'rgba(74, 222, 128, 0.55)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#86efac';
      ctx.font = '800 11px "Inter", sans-serif';
      ctx.fillText('WATTS / dB', pivotX, boxY + boxH * 0.56);
      ctx.restore();

      ctx.fillStyle = '#7dd3fc';
      ctx.font = '700 9px "JetBrains Mono", monospace';
      ctx.fillText(channelLabel, pivotX, boxY + boxH * 0.71);

      // 우측 상단 POWER GUARD / PEAK LED 인디케이터
      const ledX = boxX + boxW - 22;
      const ledY = boxY + 15;
      const isPeakLit = peakVal > 0.76;
      ctx.beginPath();
      ctx.arc(ledX, ledY, 4, 0, Math.PI * 2);
      ctx.fillStyle = isPeakLit ? '#fb923c' : 'rgba(124, 45, 18, 0.45)';
      ctx.fill();
      if (isPeakLit) {
        ctx.shadowColor = '#fb923c';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = '#bae6fd';
      ctx.font = '700 6.5px "JetBrains Mono", monospace';
      ctx.fillText('GUARD', ledX, ledY + 11);

      const clamped = Math.max(0, Math.min(1.04, needleVal));
      const needleAng = startAngle + (endAngle - startAngle) * clamped;
      const needleLen = radius + 7;

      // 바늘 그림자
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(pivotX + 2, pivotY + 2);
      ctx.lineTo(pivotX + 2 + Math.cos(needleAng) * needleLen, pivotY + 2 + Math.sin(needleAng) * needleLen);
      ctx.stroke();

      // 바늘 본체 (매킨토시 오렌지-레드 팁 & 발광 화이트 바늘)
      ctx.save();
      ctx.shadowColor = clamped > 0.72 ? 'rgba(248, 113, 113, 0.85)' : 'rgba(224, 242, 254, 0.75)';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = clamped > 0.72 ? '#f87171' : '#f0f9ff';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(pivotX + Math.cos(needleAng) * needleLen, pivotY + Math.sin(needleAng) * needleLen);
      ctx.stroke();
      ctx.restore();

      // 하단 힌지 캡
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.arc(pivotX, boxY + boxH - 2, 16, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 베젤 테두리
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.32)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(boxX + 0.75, boxY + 0.75, boxW - 1.5, boxH - 1.5, 10);
      ctx.stroke();

      ctx.restore();
    }

    function drawDualVuMeters(ctx, w, h, metrics) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#09090d';
      ctx.fillRect(0, 0, w, h);

      const attack = 0.52;
      const release = 0.22;
      vuNeedleL += (metrics.rmsL - vuNeedleL) * (metrics.rmsL > vuNeedleL ? attack : release);
      vuNeedleR += (metrics.rmsR - vuNeedleR) * (metrics.rmsR > vuNeedleR ? attack : release);

      if (vuNeedleL >= vuPeakHoldL) {
        vuPeakHoldL = vuNeedleL;
        vuPeakTimerL = 36;
      } else if (vuPeakTimerL > 0) {
        vuPeakTimerL--;
      } else {
        vuPeakHoldL *= 0.94;
      }

      if (vuNeedleR >= vuPeakHoldR) {
        vuPeakHoldR = vuNeedleR;
        vuPeakTimerR = 36;
      } else if (vuPeakTimerR > 0) {
        vuPeakTimerR--;
      } else {
        vuPeakHoldR *= 0.94;
      }

      const pad = 12;
      const gap = 10;
      if (w >= h * 1.15) {
        const meterW = (w - pad * 2 - gap) * 0.5;
        const meterH = h - pad * 2;
        drawSingleVuMeter(ctx, pad, pad, meterW, meterH, 'LEFT CHANNEL', vuNeedleL, vuPeakHoldL);
        drawSingleVuMeter(ctx, pad + meterW + gap, pad, meterW, meterH, 'RIGHT CHANNEL', vuNeedleR, vuPeakHoldR);
      } else {
        const meterW = w - pad * 2;
        const meterH = (h - pad * 2 - gap) * 0.5;
        drawSingleVuMeter(ctx, pad, pad, meterW, meterH, 'LEFT CHANNEL', vuNeedleL, vuPeakHoldL);
        drawSingleVuMeter(ctx, pad, pad + meterH + gap, meterW, meterH, 'RIGHT CHANNEL', vuNeedleR, vuPeakHoldR);
      }
    }

    // 3) 오로라 리본 웨이브 & 스파클 비주얼라이저 (차분한 감도 + 웅장하고 깊은 파동 높낮이)
    let smoothedAuroraEnergy = 0;
    const smoothedAuroraSpectrum = new Float32Array(32);

    function drawAuroraVisualizer(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#04060e');
      skyGrad.addColorStop(0.55, '#0a0f1f');
      skyGrad.addColorStop(1, '#08080e');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // 감도(반응 민감도)는 낮추고 묵직한 로우패스 필터로 부드럽게 추종
      const targetEnergy = Math.min(1, (metrics.rmsL + metrics.rmsR) * 0.32);
      smoothedAuroraEnergy += (targetEnergy - smoothedAuroraEnergy) * 0.04;
      const energy = smoothedAuroraEnergy;

      for (let i = 0; i < 32; i++) {
        const targetSpec = (metrics.spectrum[i] || 0) * 0.28;
        smoothedAuroraSpectrum[i] += (targetSpec - smoothedAuroraSpectrum[i]) * 0.05;
      }

      // 물결 흐름 속도는 여유롭고 우아하게 유지
      const speed = metrics.isPlaying ? 0.58 + energy * 0.25 : 0.24;

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 파동 진폭(amp)을 크게 확장하여 웅장한 높낮이와 역동적인 굴곡 표현
      const ribbons = [
        { c1: 'rgba(251, 191, 36, 0.36)', c2: 'rgba(244, 63, 94, 0.22)', freq: 1.6, phase: 0.0, amp: 0.27, yOff: 0.50 },
        { c1: 'rgba(56, 189, 248, 0.40)', c2: 'rgba(168, 85, 247, 0.24)', freq: 2.0, phase: 1.7, amp: 0.30, yOff: 0.52 },
        { c1: 'rgba(52, 211, 153, 0.36)', c2: 'rgba(59, 130, 246, 0.20)', freq: 1.35, phase: 3.2, amp: 0.26, yOff: 0.56 },
        { c1: 'rgba(253, 224, 71, 0.28)', c2: 'rgba(236, 72, 153, 0.18)', freq: 2.3, phase: 4.6, amp: 0.23, yOff: 0.48 }
      ];

      ribbons.forEach((rb, rIdx) => {
        const ribbonGrad = ctx.createLinearGradient(0, h * 0.10, w, h * 0.90);
        ribbonGrad.addColorStop(0, 'rgba(0,0,0,0)');
        ribbonGrad.addColorStop(0.22, rb.c1);
        ribbonGrad.addColorStop(0.78, rb.c2);
        ribbonGrad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = ribbonGrad;
        ctx.beginPath();
        ctx.moveTo(0, h);

        const steps = 56;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = t * w;
          const specIdx = Math.min(31, Math.floor(t * 32));
          const specBoost = smoothedAuroraSpectrum[specIdx] * (h * 0.16);
          const wave1 = Math.sin(t * Math.PI * rb.freq + nowSec * speed + rb.phase);
          const wave2 = Math.cos(t * Math.PI * (rb.freq * 1.45) - nowSec * speed * 0.55 + rIdx);
          const dynamicHeight = h * rb.amp * (0.68 + energy * 0.62);
          const y = h * rb.yOff + (wave1 * 0.68 + wave2 * 0.32) * dynamicHeight - specBoost * 0.65;
          ctx.lineTo(x, y);
        }

        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = rb.c1;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = t * w;
          const specIdx = Math.min(31, Math.floor(t * 32));
          const specBoost = smoothedAuroraSpectrum[specIdx] * (h * 0.16);
          const wave1 = Math.sin(t * Math.PI * rb.freq + nowSec * speed + rb.phase);
          const wave2 = Math.cos(t * Math.PI * (rb.freq * 1.45) - nowSec * speed * 0.55 + rIdx);
          const dynamicHeight = h * rb.amp * (0.68 + energy * 0.62);
          const y = h * rb.yOff + (wave1 * 0.68 + wave2 * 0.32) * dynamicHeight - specBoost * 0.65;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });

      auroraParticles.forEach(pt => {
        const driftY = (pt.y - nowSec * pt.speed * (0.3 + energy * 0.4) + 10) % 1;
        const px = ((pt.x + Math.sin(nowSec * 0.45 + pt.phase) * 0.02 + 1) % 1) * w;
        const py = driftY * h;
        const twinkle = 0.25 + 0.75 * Math.abs(Math.sin(nowSec * 1.4 + pt.phase));
        ctx.fillStyle = `rgba(224, 242, 254, ${twinkle * (0.28 + energy * 0.42)})`;
        ctx.beginPath();
        ctx.arc(px, py, pt.r * (0.75 + energy * 0.35), 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    // 4) 바이닐 레코드판 & 라디얼 스펙트럼 비주얼라이저
    function drawVinylDiscVisualizer(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      const cx = w * 0.5;
      const cy = h * 0.5;
      const minDim = Math.min(w, h);
      const discR = Math.max(28, minDim * 0.31);
      const energy = Math.min(1, (metrics.rmsL + metrics.rmsR) * 0.85);

      const activeAlbum = filteredAlbums.find(a => a.id === selectedId);
      const accentBg = activeAlbum?.palette?.bg || '#d97706';

      const haloR1 = Math.max(discR + 8, minDim * 0.48);
      const haloGrad = ctx.createRadialGradient(cx, cy, discR * 0.6, cx, cy, haloR1);
      haloGrad.addColorStop(0, `rgba(251, 191, 36, ${0.14 + energy * 0.22})`);
      haloGrad.addColorStop(1, 'rgba(7, 8, 11, 0)');
      ctx.fillStyle = haloGrad;
      ctx.fillRect(0, 0, w, h);

      const bandCount = 64;
      ctx.save();
      ctx.translate(cx, cy);
      for (let i = 0; i < bandCount; i++) {
        const specIdx = i < 32 ? i : 63 - i;
        const targetVal = metrics.spectrum[specIdx] || 0;
        smoothedRadialBands[i] += (targetVal - smoothedRadialBands[i]) * 0.28;

        const angle = (i / bandCount) * Math.PI * 2 - Math.PI * 0.5;
        const barLen = 4 + smoothedRadialBands[i] * (minDim * 0.16);
        const rStart = discR + 4;
        const rEnd = rStart + barLen;

        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * rStart, Math.sin(angle) * rStart);
        ctx.lineTo(Math.cos(angle) * rEnd, Math.sin(angle) * rEnd);
        ctx.strokeStyle = smoothedRadialBands[i] > 0.62
          ? 'rgba(253, 224, 71, 0.92)'
          : 'rgba(251, 191, 36, 0.48)';
        ctx.lineWidth = Math.max(2, (Math.PI * 2 * rStart) / bandCount * 0.52);
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      ctx.restore();

      if (metrics.isPlaying) {
        vinylRotation += 0.024;
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(vinylRotation);

      ctx.beginPath();
      ctx.arc(0, 0, discR, 0, Math.PI * 2);
      ctx.fillStyle = '#0d0e12';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.stroke();

      for (let g = 0.48; g <= 0.92; g += 0.07) {
        ctx.beginPath();
        ctx.arc(0, 0, discR * g, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, discR * 0.96, -0.45, 0.18);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, discR * 0.96, Math.PI - 0.45, Math.PI + 0.18);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.fill();

      const labelR = discR * 0.36;
      ctx.beginPath();
      ctx.arc(0, 0, labelR, 0, Math.PI * 2);
      ctx.fillStyle = accentBg;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.65)';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, Math.max(3, discR * 0.06), 0, Math.PI * 2);
      ctx.fillStyle = '#07080b';
      ctx.fill();

      ctx.restore();
    }

    // 5) 빈티지 듀얼 릴투릴(REEL) 테이프 데크 (실물 랙마운트 알루미늄 베젤 + 크롬 릴 + 듀얼 미니 VU 미터)
    function drawReelTapeVisualizer(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      // 1) 다층 브러시드 실버-티타늄 알루미늄 페이스플레이트 배경
      const plateGrad = ctx.createLinearGradient(0, 0, 0, h);
      plateGrad.addColorStop(0, '#d6dae2');
      plateGrad.addColorStop(0.14, '#bcc2cd');
      plateGrad.addColorStop(0.52, '#a7aebc');
      plateGrad.addColorStop(0.88, '#8d94a3');
      plateGrad.addColorStop(1, '#737a8a');
      ctx.fillStyle = plateGrad;
      ctx.fillRect(0, 0, w, h);

      // 미세 브러시드 메탈 가로 헤어라인 질감 (명암 교차)
      for (let y = 0; y < h; y += 2) {
        ctx.fillStyle = y % 4 === 0 ? 'rgba(255, 255, 255, 0.09)' : 'rgba(15, 23, 42, 0.04)';
        ctx.fillRect(0, y, w, 1);
      }

      // 랙마운트 외곽 입체 베젤 & 상하단 리세스 홈
      ctx.strokeStyle = '#272930';
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, w - 4, h - 4);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1;
      ctx.strokeRect(4.5, 4.5, w - 9, h - 9);

      // 모서리 육각/십자 나사 볼트
      [[13, 13], [w - 13, 13], [13, h - 13], [w - 13, h - 13]].forEach(([bx, by]) => {
        const sGrad = ctx.createRadialGradient(bx - 1.5, by - 1.5, 0.5, bx, by, 5);
        sGrad.addColorStop(0, '#f4f4f5');
        sGrad.addColorStop(0.6, '#71717a');
        sGrad.addColorStop(1, '#27272a');
        ctx.beginPath();
        ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = sGrad;
        ctx.fill();
        ctx.strokeStyle = '#18181b';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx - 2.2, by - 2.2);
        ctx.lineTo(bx + 2.2, by + 2.2);
        ctx.stroke();
      });

      // 상단 각인 모델명 & 테이프 스피드 인디케이터
      ctx.fillStyle = 'rgba(24, 24, 27, 0.72)';
      ctx.font = '800 8.5px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SPINE REEL-200  •  15 IPS MASTER', w * 0.5, 16);

      const progress = audioEl.duration ? Math.min(1, Math.max(0, audioEl.currentTime / audioEl.duration)) : 0.38;
      const energy = Math.min(1, (metrics.rmsL + metrics.rmsR) * 0.75);

      if (metrics.isPlaying) {
        reelAngleL += 0.024 + progress * 0.012;
        reelAngleR += 0.034 - progress * 0.012;
      }

      const reelY = h * 0.40;
      const reelDist = Math.min(w * 0.24, h * 0.39);
      const lx = w * 0.5 - reelDist;
      const rx = w * 0.5 + reelDist;
      const outerR = Math.max(26, Math.min(w * 0.215, h * 0.34));
      const hubR = outerR * 0.33;

      const tapeRL = hubR + (outerR * 0.88 - hubR) * (1 - progress * 0.75);
      const tapeRR = hubR + (outerR * 0.88 - hubR) * (0.25 + progress * 0.75);

      // 하단 메탈릭 테이프 트랜스포트 헤드 & 크롬 가이드 롤러
      const deckY = reelY + outerR + 10;
      const rollerY = Math.min(h * 0.73, deckY + 8);
      const glX = lx - outerR * 0.32;
      const grX = rx + outerR * 0.32;
      const headX = w * 0.5;

      // 마그네틱 테이프 주행 라인 + 미세 앰버 하이라이트
      ctx.save();
      ctx.strokeStyle = '#291509';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(lx - tapeRL * 0.94, reelY + tapeRL * 0.32);
      ctx.lineTo(glX, rollerY);
      ctx.lineTo(headX - 30, rollerY - 5);
      ctx.lineTo(headX + 30, rollerY - 5);
      ctx.lineTo(grX, rollerY);
      ctx.lineTo(rx + tapeRR * 0.94, reelY + tapeRR * 0.32);
      ctx.stroke();

      // 크롬 텐션 암 & 가이드 롤러 (좌/우)
      [glX, grX, headX - 38, headX + 38].forEach((gx, idx) => {
        const gy = idx < 2 ? rollerY : rollerY - 2;
        const r = idx < 2 ? 7.5 : 5.5;
        ctx.beginPath();
        ctx.arc(gx + 1.5, gy + 2, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.fill();

        const rGrad = ctx.createRadialGradient(gx - 2, gy - 2, 1, gx, gy, r);
        rGrad.addColorStop(0, '#ffffff');
        rGrad.addColorStop(0.45, '#cbd5e1');
        rGrad.addColorStop(0.85, '#64748b');
        rGrad.addColorStop(1, '#1e293b');
        ctx.beginPath();
        ctx.arc(gx, gy, r, 0, Math.PI * 2);
        ctx.fillStyle = rGrad;
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // 중앙 스테레오 마그네틱 헤드 하우징 실드
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.roundRect(headX - 31, rollerY - 16, 64, 24, 4);
      ctx.fill();

      const hGrad = ctx.createLinearGradient(headX - 32, rollerY - 18, headX + 32, rollerY + 8);
      hGrad.addColorStop(0, '#52525b');
      hGrad.addColorStop(0.35, '#e4e4e7');
      hGrad.addColorStop(0.65, '#a1a1aa');
      hGrad.addColorStop(1, '#3f3f46');
      ctx.fillStyle = hGrad;
      ctx.beginPath();
      ctx.roundRect(headX - 32, rollerY - 18, 64, 23, 4);
      ctx.fill();
      ctx.strokeStyle = '#18181b';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = '#18181b';
      ctx.font = '800 6.5px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('MAGNETIC HEAD', headX, rollerY - 5);

      // 중앙 파일럿 램프 (헤드 블록 위)
      ctx.beginPath();
      ctx.arc(headX, reelY, 5, 0, Math.PI * 2);
      ctx.fillStyle = metrics.isPlaying ? '#f59e0b' : '#52525b';
      if (metrics.isPlaying) {
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 14;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#27272a';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      // 개별 오픈 릴(Open Reel) 입체 렌더링
      const drawSingleReel = (cx, cy, tapeR, angle) => {
        ctx.save();
        ctx.translate(cx, cy);

        // 릴 드롭 그림자
        ctx.beginPath();
        ctx.arc(4, 6, outerR, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
        ctx.fill();

        // 투명 아크릴 보호 플랜지 베이스 + 반사광
        const flangeGrad = ctx.createLinearGradient(-outerR, -outerR, outerR, outerR);
        flangeGrad.addColorStop(0, 'rgba(39, 39, 42, 0.85)');
        flangeGrad.addColorStop(0.45, 'rgba(24, 24, 27, 0.78)');
        flangeGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.14)');
        flangeGrad.addColorStop(1, 'rgba(15, 15, 20, 0.88)');
        ctx.beginPath();
        ctx.arc(0, 0, outerR, 0, Math.PI * 2);
        ctx.fillStyle = flangeGrad;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.stroke();

        // 마그네틱 테이프 감김 영역
        ctx.beginPath();
        ctx.arc(0, 0, tapeR, 0, Math.PI * 2);
        ctx.fillStyle = '#26140c';
        ctx.fill();

        for (let r = hubR + 3; r < tapeR; r += 3.5) {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.055)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // 회전하는 3날 브러시드 알루미늄 릴 스포크
        ctx.rotate(angle);
        for (let s = 0; s < 3; s++) {
          const a = (s * Math.PI * 2) / 3;
          ctx.save();
          ctx.rotate(a);
          const spokeGrad = ctx.createLinearGradient(hubR, -10, outerR, 10);
          spokeGrad.addColorStop(0, '#f4f4f5');
          spokeGrad.addColorStop(0.5, '#d4d4d8');
          spokeGrad.addColorStop(1, '#a1a1aa');
          ctx.beginPath();
          ctx.moveTo(hubR * 0.9, -6.5);
          ctx.lineTo(outerR * 0.96, -13);
          ctx.arc(0, 0, outerR * 0.96, -0.23, 0.23);
          ctx.lineTo(hubR * 0.9, 6.5);
          ctx.closePath();
          ctx.fillStyle = spokeGrad;
          ctx.fill();
          ctx.strokeStyle = 'rgba(24, 24, 27, 0.55)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }

        // 중앙 NAB 메탈 클램프 허브 & 3핀 락
        const hubGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, hubR);
        hubGrad.addColorStop(0, '#e4e4e7');
        hubGrad.addColorStop(0.55, '#52525b');
        hubGrad.addColorStop(1, '#18181b');
        ctx.beginPath();
        ctx.arc(0, 0, hubR, 0, Math.PI * 2);
        ctx.fillStyle = hubGrad;
        ctx.fill();
        ctx.strokeStyle = '#f4f4f5';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 허브 내 3개 고정 핀 홀
        for (let p = 0; p < 3; p++) {
          const pa = (p * Math.PI * 2) / 3;
          ctx.beginPath();
          ctx.arc(Math.cos(pa) * hubR * 0.62, Math.sin(pa) * hubR * 0.62, Math.max(1.5, hubR * 0.11), 0, Math.PI * 2);
          ctx.fillStyle = '#09090b';
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(0, 0, hubR * 0.32, 0, Math.PI * 2);
        ctx.fillStyle = '#09090b';
        ctx.fill();

        ctx.restore();
      };

      drawSingleReel(lx, reelY, tapeRL, reelAngleL);
      drawSingleReel(rx, reelY, tapeRR, reelAngleR);

      // 하단 좌측 웜-앰버 듀얼 미니 VU 미터 & 우측 트랜스포트 버튼 (겹침 방지 + 내부 클리핑 적용)
      const bottomY = Math.max(rollerY + 12, h * 0.76);
      const bottomH = Math.max(24, h - bottomY - 11);
      if (bottomH >= 20) {
        const miniW = Math.min(72, Math.max(44, w * 0.165));
        const vuGap = 6;
        const vuTotalW = miniW * 2 + vuGap;
        const startX = Math.max(18, Math.min(w * 0.5 - vuTotalW - 14, w * 0.5 - reelDist - outerR * 0.45));

        [metrics.rmsL, metrics.rmsR].forEach((lvl, idx) => {
          const mx = startX + idx * (miniW + vuGap);
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(mx, bottomY, miniW, bottomH, 4);
          ctx.clip();

          const vuBg = ctx.createRadialGradient(mx + miniW * 0.5, bottomY + bottomH * 0.85, 2, mx + miniW * 0.5, bottomY + bottomH * 0.5, miniW * 0.72);
          vuBg.addColorStop(0, '#fef9c3');
          vuBg.addColorStop(1, '#f59e0b');
          ctx.fillStyle = vuBg;
          ctx.fillRect(mx, bottomY, miniW, bottomH);

          // 미니 눈금 & 바늘 (피벗을 하단 테두리 안쪽에 두고 반경을 bottomH * 0.78 이내로 제한)
          const pX = mx + miniW * 0.5;
          const pY = bottomY + bottomH * 1.04;
          const mR = Math.min(miniW * 0.48, bottomH * 0.78);
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.arc(pX, pY, mR, -Math.PI * 0.74, -Math.PI * 0.26);
          ctx.stroke();

          ctx.fillStyle = '#451a03';
          ctx.font = '800 6px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(idx === 0 ? 'VU L' : 'VU R', pX, bottomY + bottomH * 0.56);

          const ang = -Math.PI * 0.74 + Math.PI * 0.48 * Math.min(1, lvl * 1.05);
          ctx.strokeStyle = '#dc2626';
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(pX, pY);
          ctx.lineTo(pX + Math.cos(ang) * (mR - 1), pY + Math.sin(ang) * (mR - 1));
          ctx.stroke();

          // 미터 외곽 테두리
          ctx.strokeStyle = '#18181b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(mx, bottomY, miniW, bottomH, 4);
          ctx.stroke();
          ctx.restore();
        });

        // 우측 트랜스포트 물리 버튼들 (VU 영역 오른쪽 여백 확보)
        const vuEndX = startX + vuTotalW;
        const btnStartX = Math.max(w * 0.5 + 8, vuEndX + 12);
        const btnGap = 4;
        const availBtnW = w - btnStartX - 18;
        const btnW = Math.min(26, (availBtnW - btnGap * 4) / 5);
        if (btnW >= 10) {
          const btnSpecs = [
            { col: '#27272a', sym: '◀◀' },
            { col: '#27272a', sym: '▶▶' },
            { col: '#16a34a', sym: '▶' },
            { col: '#27272a', sym: '■' },
            { col: '#dc2626', sym: '●' }
          ];
          btnSpecs.forEach((spec, bIdx) => {
            const bx = btnStartX + bIdx * (btnW + btnGap);
            const by = bottomY + bottomH * 0.20;
            const bh = bottomH * 0.60;
            ctx.fillStyle = spec.col;
            ctx.beginPath();
            ctx.roundRect(bx, by, btnW, bh, 3);
            ctx.fill();
            ctx.strokeStyle = '#09090b';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '700 6.5px "Inter", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(spec.sym, bx + btnW * 0.5, by + bh * 0.66);
          });
        }
      }
    }

    // 6) 진공관 앰프 글로우 (TUBE) 비주얼라이저 (KT88 대형 출력관 + 12AX7 프리관 교차 배열 & 입체 유리 글로우)
    function drawVacuumTubeVisualizer(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      // 랙 섀시 내부 다크 캐비닛 배경 + 상단 방열 그릴
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#060508');
      bgGrad.addColorStop(0.65, '#120e16');
      bgGrad.addColorStop(1, '#1c1720');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 상단 내부 배선 실루엣 디테일
      ctx.strokeStyle = 'rgba(217, 160, 91, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.13);
      ctx.bezierCurveTo(w * 0.3, h * 0.07, w * 0.65, h * 0.21, w, h * 0.10);
      ctx.stroke();

      const bass = Math.min(1, ((metrics.spectrum[0] || 0) + (metrics.spectrum[1] || 0) + (metrics.spectrum[2] || 0)) / 2.1);
      const chassisY = h * 0.78;

      // 하단 매트 블랙 스틸 섀시 & 토글 스위치 / 노브
      const chGrad = ctx.createLinearGradient(0, chassisY, 0, h);
      chGrad.addColorStop(0, '#232329');
      chGrad.addColorStop(1, '#111114');
      ctx.fillStyle = chGrad;
      ctx.fillRect(0, chassisY, w, h - chassisY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, chassisY);
      ctx.lineTo(w, chassisY);
      ctx.stroke();

      // 섀시 전면 파워 토글 스위치, 파일럿 램프 & 볼륨/바이어스 노브
      const knobY = chassisY + (h - chassisY) * 0.54;
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.arc(w * 0.12, knobY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e4e4e7';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.12, knobY);
      ctx.lineTo(w * 0.12 + 7, knobY - 8);
      ctx.stroke();

      // 파일럿 램프
      ctx.beginPath();
      ctx.arc(w * 0.20, knobY, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = metrics.isPlaying ? '#fb923c' : '#52525b';
      if (metrics.isPlaying) {
        ctx.shadowColor = '#fb923c';
        ctx.shadowBlur = 10;
      }
      ctx.fill();
      ctx.shadowBlur = 0;

      // 중앙 각인 라벨
      ctx.fillStyle = 'rgba(228, 228, 231, 0.55)';
      ctx.font = '700 7.5px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('KT88 PUSH-PULL CLASS-A', w * 0.50, knobY + 3);

      // 우측 알루미늄 노브 2개
      [w * 0.80, w * 0.90].forEach((kx, kIdx) => {
        const kr = Math.min(11, (h - chassisY) * 0.35);
        const kGrad = ctx.createRadialGradient(kx - 2, knobY - 2, 1, kx, knobY, kr);
        kGrad.addColorStop(0, '#52525b');
        kGrad.addColorStop(1, '#09090b');
        ctx.beginPath();
        ctx.arc(kx, knobY, kr, 0, Math.PI * 2);
        ctx.fillStyle = kGrad;
        ctx.fill();
        ctx.strokeStyle = '#a1a1aa';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        const kAng = kIdx === 0 ? -0.9 + bass * 0.5 : -0.4;
        ctx.beginPath();
        ctx.moveTo(kx, knobY);
        ctx.lineTo(kx + Math.cos(kAng) * (kr - 2), knobY + Math.sin(kAng) * (kr - 2));
        ctx.stroke();
      });

      // KT88 대형 진공관과 12AX7 소형 프리관 교차 배치
      const slots = w > h * 0.92
        ? [
            { x: 0.16, scale: 1.0, label: 'KT88' },
            { x: 0.30, scale: 0.56, label: '12AX7' },
            { x: 0.44, scale: 1.0, label: 'KT88' },
            { x: 0.58, scale: 0.56, label: '12AX7' },
            { x: 0.72, scale: 1.0, label: 'KT88' },
            { x: 0.85, scale: 0.88, label: '5U4G' }
          ]
        : [
            { x: 0.24, scale: 1.0, label: 'KT88' },
            { x: 0.50, scale: 0.58, label: '12AX7' },
            { x: 0.76, scale: 1.0, label: 'KT88' }
          ];

      const baseW = Math.min(w * 0.135, h * 0.24, 66);
      const baseH = Math.min(h * 0.60, baseW * 2.55);

      slots.forEach((slot, idx) => {
        const cx = w * slot.x;
        const tubeW = baseW * slot.scale;
        const tubeH = baseH * slot.scale;
        const topY = chassisY - tubeH;
        const chEnergy = idx % 2 === 0 ? metrics.rmsL : metrics.rmsR;
        const glowPower = metrics.isPlaying ? 0.46 + chEnergy * 0.54 : 0.26;

        ctx.save();

        // 1) 저음 비트에 퍼지는 진공관 내부 일렉트론 블루-바이올렛 글로우
        const blueGlow = ctx.createRadialGradient(cx, topY + tubeH * 0.46, 2, cx, topY + tubeH * 0.46, tubeW * 1.65);
        blueGlow.addColorStop(0, `rgba(96, 165, 250, ${0.22 + bass * 0.48})`);
        blueGlow.addColorStop(0.55, `rgba(129, 140, 248, ${0.10 + bass * 0.24})`);
        blueGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = blueGlow;
        ctx.fillRect(cx - tubeW * 1.8, topY - 18, tubeW * 3.6, tubeH + 24);

        // 2) 유리관 외벽 (상단 돔 형태 + 입체 음영)
        const glassBodyGrad = ctx.createLinearGradient(cx - tubeW * 0.5, topY, cx + tubeW * 0.5, topY);
        glassBodyGrad.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
        glassBodyGrad.addColorStop(0.25, 'rgba(255, 255, 255, 0.03)');
        glassBodyGrad.addColorStop(0.8, 'rgba(15, 23, 42, 0.18)');
        glassBodyGrad.addColorStop(1, 'rgba(255, 255, 255, 0.10)');
        ctx.beginPath();
        ctx.roundRect(cx - tubeW * 0.5, topY, tubeW, tubeH - 12 * slot.scale, [tubeW * 0.48, tubeW * 0.48, 5, 5]);
        ctx.fillStyle = glassBodyGrad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.42)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 상단 실버 게터 코팅
        ctx.beginPath();
        ctx.ellipse(cx, topY + tubeW * 0.26, tubeW * 0.34, tubeW * 0.15, 0, Math.PI, Math.PI * 2);
        ctx.fillStyle = 'rgba(203, 213, 225, 0.38)';
        ctx.fill();

        // 3) 내부 그레이 애노드 플레이트 + 방열 슬롯 홀
        const plateW = tubeW * 0.52;
        const plateH = tubeH * 0.52;
        const plateY = topY + tubeH * 0.25;
        ctx.fillStyle = '#18181b';
        ctx.strokeStyle = 'rgba(161, 161, 170, 0.48)';
        ctx.lineWidth = 1;
        ctx.fillRect(cx - plateW * 0.5, plateY, plateW, plateH);
        ctx.strokeRect(cx - plateW * 0.5, plateY, plateW, plateH);

        // 상/하단 운모(Mica) 디스크
        [plateY - 2, plateY + plateH + 2].forEach(my => {
          ctx.beginPath();
          ctx.ellipse(cx, my, tubeW * 0.42, 2.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(228, 228, 231, 0.46)';
          ctx.fill();
        });

        // 4) 발광하는 오렌지-앰버 히터 필라멘트 코어
        const flicker = 0.94 + 0.06 * Math.sin(nowSec * 16 + idx * 2.1);
        const filGrad = ctx.createRadialGradient(cx, plateY + plateH * 0.52, 1, cx, plateY + plateH * 0.52, tubeW * 0.9);
        filGrad.addColorStop(0, `rgba(255, 251, 235, ${glowPower * flicker})`);
        filGrad.addColorStop(0.32, `rgba(251, 146, 60, ${glowPower * 0.96})`);
        filGrad.addColorStop(0.72, `rgba(234, 88, 12, ${glowPower * 0.48})`);
        filGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = filGrad;
        ctx.fillRect(cx - tubeW * 0.95, plateY - 12, tubeW * 1.9, plateH + 24);

        // 상단/하단 히터 노출 코일 팁
        ctx.strokeStyle = `rgba(254, 215, 170, ${0.55 + glowPower * 0.45})`;
        ctx.lineWidth = Math.max(1.5, 2.3 * slot.scale);
        [-tubeW * 0.13, tubeW * 0.13].forEach(ox => {
          ctx.beginPath();
          ctx.moveTo(cx + ox, plateY - 6 * slot.scale);
          ctx.lineTo(cx + ox, plateY + plateH + 6 * slot.scale);
          ctx.stroke();
        });

        // 5) 유리 벽 세로 하이라이트 반사광
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
        ctx.lineWidth = Math.max(1.3, 2.2 * slot.scale);
        ctx.beginPath();
        ctx.moveTo(cx - tubeW * 0.34, topY + tubeW * 0.44);
        ctx.lineTo(cx - tubeW * 0.34, chassisY - 16 * slot.scale);
        ctx.stroke();

        // 6) 하단 메탈 소켓 베이스 & 각인 텍스트
        const sockH = Math.max(11, 15 * slot.scale);
        const sockGrad = ctx.createLinearGradient(cx - tubeW * 0.55, 0, cx + tubeW * 0.55, 0);
        sockGrad.addColorStop(0, '#3f3f46');
        sockGrad.addColorStop(0.35, '#71717a');
        sockGrad.addColorStop(1, '#18181b');
        ctx.fillStyle = sockGrad;
        ctx.strokeStyle = 'rgba(228, 228, 231, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(cx - tubeW * 0.55, chassisY - sockH, tubeW * 1.1, sockH, 2);
        ctx.fill();
        ctx.stroke();

        if (slot.scale >= 0.85) {
          ctx.fillStyle = 'rgba(254, 243, 199, 0.88)';
          ctx.font = '800 7.5px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(slot.label, cx, chassisY - sockH * 0.25);
        }

        ctx.restore();
      });
    }

    // 7) 리사주 스테레오 위상 스코프 (PHASE / LISSAJOUS — 빈티지 오실로스코프 베젤 + 우측 노브 패널)
    function drawLissajousVisualizer(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      // 빈티지 계측기 웜-그레이 메탈 페이스플레이트
      const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
      bodyGrad.addColorStop(0, '#b0b5be');
      bodyGrad.addColorStop(0.5, '#9298a3');
      bodyGrad.addColorStop(1, '#6c727e');
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#272930';
      ctx.lineWidth = 3.5;
      ctx.strokeRect(1.5, 1.5, w - 3, h - 3);

      const hasRightPanel = w > h * 0.92;
      const crtAreaW = hasRightPanel ? w * 0.64 : w;
      const cx = crtAreaW * 0.5;
      const cy = h * 0.5;
      const radius = Math.max(24, Math.min(crtAreaW * 0.42, h * 0.42));

      // 원형 CRT 베젤 & 다크 그린 인광 스크린
      const bezelGrad = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
      bezelGrad.addColorStop(0, '#374151');
      bezelGrad.addColorStop(1, '#111827');
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 9, 0, Math.PI * 2);
      ctx.fillStyle = bezelGrad;
      ctx.fill();
      ctx.strokeStyle = '#090d16';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();

      const crtGrad = ctx.createRadialGradient(cx, cy, 4, cx, cy, radius);
      crtGrad.addColorStop(0, '#0a2e1f');
      crtGrad.addColorStop(0.75, '#04160e');
      crtGrad.addColorStop(1, '#020905');
      ctx.fillStyle = crtGrad;
      ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

      // CRT 정밀 눈금 그리드 & 십자 눈금
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.18)';
      ctx.lineWidth = 1;
      const gridStep = radius / 4;
      for (let g = -3; g <= 3; g++) {
        ctx.beginPath();
        ctx.moveTo(cx + g * gridStep, cy - radius);
        ctx.lineTo(cx + g * gridStep, cy + radius);
        ctx.moveTo(cx - radius, cy + g * gridStep);
        ctx.lineTo(cx + radius, cy + g * gridStep);
        ctx.stroke();
      }

      // 다중 위상 인광 궤적 (Lissajous Harmonic Rings + 저진폭 오디오 자동 게인 보정)
      const avgWaveAmp = metrics.wave.reduce((acc, v) => acc + Math.abs(v), 0) / Math.max(1, metrics.wave.length);
      const autoGain = avgWaveAmp < 0.14 ? Math.min(4.2, 0.42 / Math.max(0.03, avgWaveAmp)) : 1.15;
      const stereoSpread = Math.max(0.28, (metrics.rmsL + metrics.rmsR) * 0.45);

      for (let layer = 0; layer < 3; layer++) {
        ctx.beginPath();
        const len = metrics.wave.length;
        const phaseShift = 14 + layer * 9;
        const scaleMod = 0.78 + layer * 0.11;
        for (let i = 0; i < len; i++) {
          const lSample = metrics.wave[i] * autoGain;
          const rIdx = (i + phaseShift) % len;
          const harmonicAux = Math.sin((i / len) * Math.PI * (2 + layer) + nowSec * (1.8 + layer * 0.5)) * stereoSpread * 0.35;
          const rSample = (metrics.wave[rIdx] * autoGain + harmonicAux) * (0.88 + 0.22 * Math.sin(nowSec * 1.9 + layer));

          const rawSide = (lSample - rSample) * 0.68 * scaleMod;
          const rawMid = (lSample + rSample) * 0.68 * scaleMod;
          const side = Math.max(-0.92, Math.min(0.92, rawSide));
          const mid = Math.max(-0.92, Math.min(0.92, rawMid));
          const px = cx + side * radius;
          const py = cy - mid * radius;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.strokeStyle = layer === 0 ? '#4ade80' : 'rgba(74, 222, 128, 0.38)';
        ctx.lineWidth = layer === 0 ? 2.2 : 1.1;
        ctx.shadowColor = 'rgba(74, 222, 128, 0.95)';
        ctx.shadowBlur = layer === 0 ? 12 : 4;
        ctx.stroke();
      }
      ctx.restore();

      // 우측 계측기 로터리 노브 & 파일럿 LED 컨트롤 패널
      if (hasRightPanel) {
        const panelX = crtAreaW + 2;
        const panelW = w - panelX - 10;
        ctx.fillStyle = 'rgba(17, 24, 39, 0.22)';
        ctx.beginPath();
        ctx.roundRect(panelX, 12, panelW, h - 24, 6);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = 'rgba(24, 24, 27, 0.78)';
        ctx.font = '800 7px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LISSAJOUS 102', panelX + panelW * 0.5, 23);

        const knobRows = [
          { ry: 0.33, lbl: 'FOCUS' },
          { ry: 0.56, lbl: 'X-Y GAIN' },
          { ry: 0.79, lbl: 'PHASE' }
        ];
        knobRows.forEach((item, idx) => {
          const kx = panelX + panelW * 0.34;
          const ky = h * item.ry;
          const kr = Math.min(13, panelW * 0.20);

          const kGrad = ctx.createRadialGradient(kx - 2, ky - 2, 1, kx, ky, kr);
          kGrad.addColorStop(0, '#3f3f46');
          kGrad.addColorStop(1, '#09090b');
          ctx.beginPath();
          ctx.arc(kx, ky, kr, 0, Math.PI * 2);
          ctx.fillStyle = kGrad;
          ctx.fill();
          ctx.strokeStyle = idx === 1 ? '#ef4444' : '#e4e4e7';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // 노브 포인터 선
          const pAng = -0.8 + idx * 0.7 + Math.sin(nowSec + idx) * 0.15;
          ctx.beginPath();
          ctx.moveTo(kx, ky);
          ctx.lineTo(kx + Math.cos(pAng) * (kr - 2), ky + Math.sin(pAng) * (kr - 2));
          ctx.stroke();

          // 옆 상태 LED
          const ledX = panelX + panelW * 0.74;
          ctx.beginPath();
          ctx.arc(ledX, ky, 3.8, 0, Math.PI * 2);
          ctx.fillStyle = metrics.isPlaying ? '#4ade80' : '#374151';
          if (metrics.isPlaying) {
            ctx.shadowColor = '#4ade80';
            ctx.shadowBlur = 8;
          }
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = 'rgba(24, 24, 27, 0.75)';
          ctx.font = '700 6px "JetBrains Mono", monospace';
          ctx.fillText(item.lbl, kx, ky + kr + 8);
        });
      }
    }

    // 8) 랙마운트 LED 도트 매트릭스 피크 홀드 이퀄라이저 (MATRIX — 좌우 랙 핸들 + 주파수 눈금 표기)
    function drawLedMatrixVisualizer(ctx, w, h, metrics) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      // 다크 건메탈 랙 페이스플레이트
      const frameGrad = ctx.createLinearGradient(0, 0, 0, h);
      frameGrad.addColorStop(0, '#32363f');
      frameGrad.addColorStop(0.5, '#22252c');
      frameGrad.addColorStop(1, '#16181d');
      ctx.fillStyle = frameGrad;
      ctx.fillRect(0, 0, w, h);

      // 좌우 알루미늄 랙 핸들
      const handleW = w > 220 ? 13 : 5;
      if (handleW >= 10) {
        [6, w - 6 - handleW].forEach(hx => {
          const hGrad = ctx.createLinearGradient(hx, 0, hx + handleW, 0);
          hGrad.addColorStop(0, '#a1a1aa');
          hGrad.addColorStop(0.5, '#e4e4e7');
          hGrad.addColorStop(1, '#52525b');
          ctx.fillStyle = hGrad;
          ctx.beginPath();
          ctx.roundRect(hx, 18, handleW, h - 36, 4);
          ctx.fill();
          ctx.strokeStyle = '#18181b';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      }

      // 내부 리세스드 블랙 LED 창
      const winX = handleW + 14;
      const winY = 14;
      const winW = w - winX * 2;
      const winH = h - 34;

      ctx.fillStyle = '#060709';
      ctx.beginPath();
      ctx.roundRect(winX, winY, winW, winH, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const cols = 24;
      const rows = 16;
      const padX = winX + 10;
      const padY = winY + 10;
      const innerW = winW - 20;
      const innerH = winH - 20;
      const cellW = innerW / cols;
      const cellH = innerH / rows;
      const dotR = Math.max(1.8, Math.min(cellW, cellH) * 0.34);

      for (let c = 0; c < cols; c++) {
        const specIdx = Math.min(31, Math.floor((c / cols) * 28));
        const val = Math.min(1, metrics.spectrum[specIdx] || 0);

        if (val >= matrixPeaks[c]) {
          matrixPeaks[c] = val;
          matrixHoldTimers[c] = 24;
        } else if (matrixHoldTimers[c] > 0) {
          matrixHoldTimers[c]--;
        } else {
          matrixPeaks[c] = Math.max(0, matrixPeaks[c] - 0.032);
        }

        const activeRows = Math.round(val * rows);
        const peakRow = Math.min(rows - 1, Math.round(matrixPeaks[c] * rows));

        for (let r = 0; r < rows; r++) {
          const cx = padX + (c + 0.5) * cellW;
          const cy = padY + innerH - (r + 0.5) * cellH;
          const isLit = r < activeRows;
          const isPeak = r === peakRow && matrixPeaks[c] > 0.04;

          let onColor = '#22c55e'; // 하단 그린
          if (r >= rows * 0.78) onColor = '#ef4444'; // 상단 레드
          else if (r >= rows * 0.52) onColor = '#f59e0b'; // 중단 앰버-옐로우

          ctx.beginPath();
          ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
          if (isLit || isPeak) {
            ctx.fillStyle = isPeak ? '#ffffff' : onColor;
            ctx.shadowColor = onColor;
            ctx.shadowBlur = isPeak ? 8 : 5;
            ctx.fill();
            ctx.shadowBlur = 0;
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.fill();
          }
        }
      }

      // 하단 주파수 대역 눈금 라벨 (31Hz ~ 16kHz)
      const freqLabels = ['31Hz', '63Hz', '125Hz', '250Hz', '500Hz', '1kHz', '2kHz', '4kHz', '8kHz', '16kHz'];
      ctx.fillStyle = 'rgba(228, 228, 231, 0.75)';
      ctx.font = '700 7.5px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      freqLabels.forEach((lbl, idx) => {
        const lx = padX + ((idx + 0.5) / freqLabels.length) * innerW;
        ctx.fillText(lbl, lx, h - 8);
      });
    }

    // 9) 워터 리플 동심원 파동 (RIPPLE) 비주얼라이저
    function drawWaterRippleVisualizer(ctx, w, h, metrics, nowSec) {
      if (w < 40 || h < 40) return;
      ctx.clearRect(0, 0, w, h);

      const poolGrad = ctx.createRadialGradient(w * 0.5, h * 0.5, 10, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
      poolGrad.addColorStop(0, '#0b1322');
      poolGrad.addColorStop(1, '#05070d');
      ctx.fillStyle = poolGrad;
      ctx.fillRect(0, 0, w, h);

      const energy = Math.min(1, (metrics.rmsL + metrics.rmsR) * 0.65);
      const spawnInterval = metrics.isPlaying ? Math.max(0.28, 0.75 - energy * 0.45) : 1.4;

      if (nowSec - lastRippleSpawnTime > spawnInterval) {
        lastRippleSpawnTime = nowSec;
        const colors = ['56, 189, 248', '251, 191, 36', '129, 140, 248', '52, 211, 153'];
        waterRipples.push({
          x: w * (0.2 + Math.random() * 0.6),
          y: h * (0.2 + Math.random() * 0.6),
          r: 4,
          maxR: Math.max(w, h) * (0.35 + energy * 0.35),
          speed: 38 + energy * 55,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
        if (waterRipples.length > 18) waterRipples.shift();
      }

      for (let i = waterRipples.length - 1; i >= 0; i--) {
        const rp = waterRipples[i];
        rp.r += rp.speed * 0.016;
        const life = 1 - rp.r / rp.maxR;
        if (life <= 0) {
          waterRipples.splice(i, 1);
          continue;
        }

        // 이중 동심원 물결
        [1, 0.72].forEach((scale, idx) => {
          const curR = rp.r * scale;
          if (curR <= 2) return;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, curR, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${rp.color}, ${(life * (idx === 0 ? 0.65 : 0.32)).toFixed(3)})`;
          ctx.lineWidth = idx === 0 ? 1.8 : 1;
          ctx.stroke();
        });
      }
    }

    let visualizerRafId = null;

    function startVisualizerLoop() {
      if (visualizerRafId !== null) return;
      visualizerRafId = requestAnimationFrame(runVisualizerLoop);
    }

    function stopVisualizerLoop() {
      if (visualizerRafId !== null) {
        cancelAnimationFrame(visualizerRafId);
        visualizerRafId = null;
      }
    }

    const VISUALIZER_DRAWERS = {
      scope: drawOscilloscope,
      vu: drawDualVuMeters,
      aurora: drawAuroraVisualizer,
      disc: drawVinylDiscVisualizer,
      reel: drawReelTapeVisualizer,
      tube: drawVacuumTubeVisualizer,
      phase: drawLissajousVisualizer,
      matrix: drawLedMatrixVisualizer,
      ripple: drawWaterRippleVisualizer
    };

    function runVisualizerLoop(ts) {
      if (!isLyricsOpen || bookletViewMode === 'lyrics') {
        visualizerRafId = null;
        return;
      }
      const box = document.getElementById('booklet-visualizer-box');
      const canvas = document.getElementById('booklet-visualizer-canvas');
      if (box && canvas && !box.classList.contains('hidden')) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetW = Math.round(box.clientWidth * dpr);
        const targetH = Math.round(box.clientHeight * dpr);
        if (targetW > 0 && targetH > 0 && (canvas.width !== targetW || canvas.height !== targetH)) {
          canvas.width = targetW;
          canvas.height = targetH;
        }
      }
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        ctx.save();
        ctx.scale(dpr, dpr);
        const logicalW = canvas.width / dpr;
        const logicalH = canvas.height / dpr;
        const nowSec = ts * 0.001;
        const metrics = sampleAudioMetrics(nowSec);
        const drawFn = VISUALIZER_DRAWERS[bookletViewMode];
        if (drawFn) drawFn(ctx, logicalW, logicalH, metrics, nowSec);
        ctx.restore();
      }
      visualizerRafId = requestAnimationFrame(runVisualizerLoop);
    }

    window.addEventListener('keydown', e => {
      if (document.activeElement === document.getElementById('search-input')) return;
      if (e.key === 'Escape') {
        if (isBookletFullscreen) {
          toggleBookletFullscreen(false);
        } else if (isCornerMenuOpen) {
          toggleCornerMenu(false);
        } else if (isExpandedMode()) {
          collapseShowcase();
        } else if (uiMode === 'ARTIST_ALBUMS_SPINE') {
          setUiMode('ARTIST_ROTARY');
        }
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const step = e.key === 'ArrowRight' ? 1 : -1;
        if (isArtistRotaryMode()) {
          stepRotary(step);
          return;
        }
        if (!filteredAlbums.length) return;
        if (isExpandedMode()) {
          stepRotary(step);
        } else {
          const curIdx = filteredAlbums.findIndex(a => a.id === selectedId);
          const nextIdx = curIdx === -1 ? 0 : (curIdx + step + filteredAlbums.length) % filteredAlbums.length;
          previewCenterSpineAlbum(filteredAlbums[nextIdx].id, true);
        }
      } else if (e.key === 'Enter') {
        if (isArtistRotaryMode() && artistGroups.length) {
          const total = artistGroups.length;
          const idx = ((Math.round(artistRotaryIndex) % total) + total) % total;
          selectArtistFromRotary(artistGroups[idx].artist);
        } else if (isSpineMode() && selectedId) {
          enterRotaryMode(selectedId);
        }
      }
    });

    let isDraggingSpine = false;
    let spineDragStartX = 0;
    let spineScrollStart = 0;
    let isProgrammaticSpineScroll = false;
    let spineScrollTimer = null;

    if (spineViewportEl) {
      spineViewportEl.addEventListener('mousedown', e => {
        isDraggingSpine = true;
        spineMoved = false;
        spineDragStartX = e.pageX;
        spineScrollStart = spineViewportEl.scrollLeft;
      });
      window.addEventListener('mousemove', e => {
        if (!isDraggingSpine) return;
        const dx = e.pageX - spineDragStartX;
        if (Math.abs(dx) > 6) {
          spineMoved = true;
          spineViewportEl.scrollLeft = spineScrollStart - dx;
        }
      });
      window.addEventListener('mouseup', () => {
        isDraggingSpine = false;
        setTimeout(() => { spineMoved = false; }, 50);
      });

      spineViewportEl.addEventListener('scroll', () => {
        renderSpines();
        if (!isSpineMode() || isProgrammaticSpineScroll || !filteredAlbums.length) return;
        clearTimeout(spineScrollTimer);
        spineScrollTimer = setTimeout(() => {
          const spineStep = 38;
          const padLeft = spineViewportEl.clientWidth * 0.46;
          const gap = getSpineCenterGap();
          const centerOffset = spineViewportEl.scrollLeft + spineViewportEl.clientWidth / 2 - padLeft - gap - 17;
          const nearestIdx = Math.max(0, Math.min(filteredAlbums.length - 1, Math.round(centerOffset / spineStep)));
          const nearestAlbum = filteredAlbums[nearestIdx];
          if (nearestAlbum && nearestAlbum.id !== selectedId) {
            previewCenterSpineAlbum(nearestAlbum.id, true);
          }
        }, 90);
      }, { passive: true });
    }

    let isDraggingWheel = false;
    let wheelDraggedMoved = false;
    let dragStartX = 0;
    let dragStartIndex = 0;
    let wheelSnapTimer = null;

    function beginDrag(clientX) {
      if (!isExpandedMode() && !isArtistRotaryMode()) return;
      isDraggingWheel = true;
      wheelDraggedMoved = false;
      dragStartX = clientX;
      dragStartIndex = isArtistRotaryMode() ? artistRotaryIndex : rotaryIndex;
    }

    function moveDrag(clientX) {
      if ((!isExpandedMode() && !isArtistRotaryMode()) || !isDraggingWheel) return;
      const dx = clientX - dragStartX;
      if (Math.abs(dx) > 6) {
        wheelDraggedMoved = true;
      }
      if (!wheelDraggedMoved) return;

      if (isArtistRotaryMode()) {
        artistRotaryIndex = dragStartIndex - dx / 135;
        renderArtistRotaryDrum();
        return;
      }
      if (!filteredAlbums.length) return;
      rotaryIndex = dragStartIndex - dx / 135;
      renderRotaryDrum();
    }

    function endDrag() {
      if (!isDraggingWheel) return;
      isDraggingWheel = false;
      if (!wheelDraggedMoved) return;

      if (isArtistRotaryMode()) {
        artistRotaryIndex = Math.round(artistRotaryIndex);
        renderArtistRotaryDrum();
        return;
      }
      if (!isExpandedMode() || !filteredAlbums.length) return;
      const total = filteredAlbums.length;
      const targetPos = Math.round(rotaryIndex);
      const targetIdx = ((targetPos % total) + total) % total;
      rotaryIndex = targetPos;
      selectAlbum(filteredAlbums[targetIdx].id, true, false, false);
    }

    stageEl.addEventListener('mousedown', e => {
      if ((!isExpandedMode() && !isArtistRotaryMode()) || e.target.closest('#showcase-card') || e.target.closest('#lyrics-booklet')) return;
      beginDrag(e.clientX);
    });
    window.addEventListener('mousemove', e => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    stageEl.addEventListener('touchstart', e => {
      if ((!isExpandedMode() && !isArtistRotaryMode()) || e.target.closest('#showcase-card') || e.target.closest('#lyrics-booklet')) return;
      if (e.touches.length === 1) beginDrag(e.touches[0].clientX);
    }, { passive: true });
    stageEl.addEventListener('touchmove', e => {
      if (!isExpandedMode() && !isArtistRotaryMode()) return;
      if (e.touches.length === 1) moveDrag(e.touches[0].clientX);
    }, { passive: true });
    stageEl.addEventListener('touchend', endDrag);

    stageEl.addEventListener('wheel', e => {
      if ((!isExpandedMode() && !isArtistRotaryMode()) || e.target.closest('#showcase-card') || e.target.closest('#lyrics-booklet')) return;
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (isArtistRotaryMode()) {
        artistRotaryIndex += delta * 0.0045;
        renderArtistRotaryDrum();
        clearTimeout(wheelSnapTimer);
        wheelSnapTimer = setTimeout(() => {
          artistRotaryIndex = Math.round(artistRotaryIndex);
          renderArtistRotaryDrum();
        }, 110);
        return;
      }
      if (!filteredAlbums.length) return;
      rotaryIndex += delta * 0.0045;
      renderRotaryDrum();
      clearTimeout(wheelSnapTimer);
      wheelSnapTimer = setTimeout(() => {
        const total = filteredAlbums.length;
        const targetPos = Math.round(rotaryIndex);
        const targetIdx = ((targetPos % total) + total) % total;
        rotaryIndex = targetPos;
        selectAlbum(filteredAlbums[targetIdx].id, true, false, false);
      }, 110);
    }, { passive: false });

    window.addEventListener('resize', () => {
      const panel = document.getElementById('corner-dropdown-panel');
      const dev = document.getElementById('spine-device');
      if (isCornerMenuOpen && panel && dev) {
        panel.style.maxHeight = `${Math.max(160, dev.clientHeight - 66)}px`;
      }
      resizeVisualizerCanvas();
      updateSpineCenterSplit();
      if (isArtistRotaryMode()) renderArtistRotaryDrum();
      else renderRotaryDrum();
    });

    window.onload = () => {
      loadPlexLibrary();
    };
  </script>
</body>
